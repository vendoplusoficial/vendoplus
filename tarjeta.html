    var m = h.match(/vl[a-f0-9]{24}/);
    if (m) return m[0];
    var q = new URLSearchParams(location.search).get('t') || '';
    m = String(q).match(/vl[a-f0-9]{24}/);
    return m ? m[0] : '';
  }

  function traer(cod) {
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var tmr = setTimeout(function () { if (ctrl) ctrl.abort(); }, 14000);
    var key = VL_CONFIG.SUPABASE_ANON_KEY;
    return fetch(VL_CONFIG.SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/rpc/vp_lealtad_tarjeta', {
      method: 'POST',
      headers: { apikey: key, Authorization: 'Bearer ' + key, 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({ p_codigo: cod }),
      cache: 'no-store',
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) {
      if (!r.ok) return { ok: false, error: r.status >= 500 ? 'servidor' : 'config' };
      return r.json();
    }).catch(function () {
      return { ok: false, error: 'red' };
    }).then(function (d) { clearTimeout(tmr); return d; });
  }

  /* =======================================================================
     PINTAR
  ======================================================================= */
  var estado = { cod: '', d: null, qrVisible: true };

  function pantallaCarga() {
    document.getElementById('root').innerHTML =
      '<div class="mid"><div class="spin"></div><p>Abriendo tu tarjeta…</p></div>';
  }

  function pantallaError(titulo, texto, reintentar) {
    document.getElementById('root').innerHTML =
      '<div class="mid"><span class="ico-big">' + ICO.alert + '</span>' +
      '<h1>' + esc(titulo) + '</h1><p>' + esc(texto) + '</p>' +
      (reintentar ? '<button id="vlRe">Intentar otra vez</button>' : '') + '</div>';
    var b = document.getElementById('vlRe');
    if (b) b.onclick = function () { pantallaCarga(); cargar(); };
  }

  function premioTexto(r) {
    if (r.tipo === 'descuento_pct') return Number(r.valor || 0) + '% de descuento';
    if (r.tipo === 'descuento_monto') return dinero(r.valor || 0) + ' de descuento';
    return (r.producto_nombre || 'Un producto') + ' gratis';
  }
  /* Si el negocio ya puso todo en el nombre ("Café gratis"), no se repite
     abajo la misma frase: se ve más limpio. */
  function detalle(r) {
    var d = premioTexto(r), n = String(r.nombre || '');
    var lim = function (s) { return s.toLowerCase().replace(/[^a-z0-9áéíóúñ ]/gi, '').trim(); };
    return (lim(d) === lim(n) || lim(n).indexOf(lim(d)) >= 0) ? '' : d;
  }

  function pinta(d) {
    estado.d = d;
    var neg = d.negocio || {}, cl = d.cliente || {};
    var color = /^#[0-9a-fA-F]{3,8}$/.test(String(neg.color || '')) ? neg.color : '#16C15B';
    document.querySelector('meta[name="theme-color"]').setAttribute('content', color);
    document.title = 'Mi tarjeta · ' + (neg.nombre || 'Lealtad');

    var meta = Number(cl.meta || 0), av = Number(cl.avance || 0);
    var pct = meta > 0 ? Math.min(100, Math.round((av / meta) * 100)) : 0;

    var gordo, unidad, sub;
    if (d.modo === 'visitas') { gordo = Number(cl.visitas || 0); unidad = gordo === 1 ? 'visita' : 'visitas'; }
    else if (d.modo === 'compras') { gordo = Number(cl.compras || 0); unidad = gordo === 1 ? 'pieza' : 'piezas'; }
    else { gordo = Number(cl.puntos || 0); unidad = gordo === 1 ? 'punto' : 'puntos'; }

    if (meta > 0) {
      sub = Number(cl.falta) > 0
        ? (Number(cl.falta) === 1 ? 'Te falta 1 para tu premio' : 'Te faltan ' + cl.falta + ' para tu premio')
        : '¡Ya puedes pedir tu premio!';
    } else sub = 'Sigue juntando';

    var enlace = location.href.split('#')[0] + '#' + estado.cod;

    /* Los premios que ya se ganó y no ha usado */
    var ganados = (d.premios || []).length
      ? '<div class="box"><h2>Tus premios listos</h2>' +
        d.premios.map(function (p) {
          var dt = detalle(p);
          return '<div class="rec"><span class="rec-i">' + ICO.gift + '</span>' +
            '<span class="rec-t"><b>' + esc(p.nombre) + '</b>' + (dt ? '<span>' + esc(dt) + '</span>' : '') + '</span>' +
            '<span class="tag">Te lo puedes llevar</span></div>';
        }).join('') +
        '<p class="nota" style="margin-top:12px;text-align:left;">Muestra tu tarjeta en el negocio y te lo entregan.</p></div>'
      : '';

    /* El catálogo de recompensas. En visitas y compras acumuladas el
       premio es uno solo: si ya se lo ganó, no se repite abajo. */
    var mostrarCat = d.modo === 'puntos' || !(d.premios || []).length;
    var cat = (mostrarCat && (d.recompensas || []).length)
      ? '<div class="box"><h2>' + (d.modo === 'puntos' ? 'Qué puedes canjear' : 'Tu premio') + '</h2>' +
        d.recompensas.map(function (rc) {
          var alcanza = d.modo !== 'puntos' || Number(cl.puntos || 0) >= Number(rc.costo_puntos || 0);
          var dt2 = detalle(rc);
          return '<div class="rec"><span class="rec-i">' + (rc.tipo === 'producto' ? ICO.gift : ICO.tag) + '</span>' +
            '<span class="rec-t"><b>' + esc(rc.nombre) + '</b>' + (dt2 ? '<span>' + esc(dt2) + '</span>' : '') + '</span>' +
            (d.modo === 'puntos'
              ? '<span class="tag ' + (alcanza ? '' : 'gris') + '">' + rc.costo_puntos + ' pts</span>'
              : '') + '</div>';
        }).join('') + '</div>'
      : '';

    document.getElementById('root').innerHTML =
      '<div class="card" style="background:' + esc(color) + ';">' +
        '<div class="biz">' +
          (neg.logo ? '<img src="' + esc(neg.logo) + '" alt="" onerror="this.outerHTML=\'<span class=&quot;biz-ini&quot;>' + esc(inicial(neg.nombre)) + '</span>\'">'
                    : '<span class="biz-ini">' + esc(inicial(neg.nombre)) + '</span>') +
          '<div style="min-width:0;flex:1;"><b>' + esc(neg.nombre || 'Mi negocio') + '</b>' +
          '<span>' + esc(neg.mensaje || 'Tarjeta de lealtad') + '</span></div>' +
        '</div>' +
        '<div class="big">' + gordo + '<small>' + esc(unidad) + '</small></div>' +
        '<div class="who">' + esc(cl.nombre || '') + '</div>' +
        (meta > 0 ? '<div class="bar"><i id="vlBar"></i></div><div class="falta">' + esc(sub) + '</div>' : '') +
        '<div class="qr" id="vlQrBox">' + qrSVG(enlace) + '</div>' +
        '<div class="cod">' + esc(estado.cod) + '</div>' +
      '</div>' +
      ganados + cat +
      '<p class="nota">Enséñale este código al negocio cuando compres y ' +
        (d.modo === 'puntos' ? 'tus puntos se suman solos'
                             : (d.modo === 'visitas' ? 'tus visitas se suman solas' : 'tus compras se cuentan solas')) +
        '. Guarda este enlace o agrégalo a tu pantalla de inicio.</p>' +
      '<p class="pie">Vendo Plus</p>';

    /* La barra se llena después de pintar, para que se vea el avance */
    requestAnimationFrame(function () {
      var b = document.getElementById('vlBar');
      if (b) b.style.width = pct + '%';
    });
  }

  /* =======================================================================
     ARRANQUE  +  se mantiene al día
  ======================================================================= */
  function cargar() {
    return traer(estado.cod).then(function (d) {
      if (d && d.ok) { pinta(d); return true; }
      var e = (d && d.error) || 'red';
      if (e === 'codigo_invalido' || e === 'sin_tarjeta') {
        pantallaError('Esta tarjeta ya no está disponible',
          'El enlace puede estar incompleto o el negocio generó una tarjeta nueva. Pídele que te mande la tarjeta otra vez.', false);
      } else if (e === 'programa_apagado') {
        pantallaError('El programa no está activo',
          'Este negocio tiene su programa de lealtad apagado por ahora. Tus puntos no se pierden: se quedan guardados.', true);
      } else if (e === 'config') {
        pantallaError('Esta tarjeta no está lista todavía',
          'Al negocio le falta terminar de preparar su programa de lealtad.', true);
      } else {
        pantallaError('No pudimos abrir tu tarjeta',
          'Revisa tu conexión a internet e inténtalo otra vez.', true);
      }
      return false;
    });
  }

  var cod = codigo();
  if (!cod) {
    pantallaError('Falta el código de la tarjeta',
      'Abre el enlace completo que te mandó el negocio por WhatsApp.', false);
    return;
  }
  estado.cod = cod;
  cargar();

  /* Si el cliente deja la pestaña abierta y luego compra, al volver ve sus
     puntos al día. Sin pedir nada: solo se vuelve a leer. */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && estado.d) {
      traer(estado.cod).then(function (d) { if (d && d.ok) pinta(d); });
    }
  });
  window.addEventListener('online', function () { if (!estado.d) cargar(); });
  window.addEventListener('hashchange', function () {
    var c2 = codigo();
    if (c2 && c2 !== estado.cod) location.reload();
  });
})();
</script>
</body>
</html>
