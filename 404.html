<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<title>VendoPlus</title>
<script>
/* =====================================================================
   ENRUTADOR DE /promotores/CODIGO
   ---------------------------------------------------------------------
   GitHub Pages es estático: no existe el archivo /promotores/ABNER001,
   así que el servidor entrega este 404.html. Aquí se detecta que era un
   enlace de invitación y se manda al portal conservando el código.
   El portal vuelve a dejar la dirección bonita en la barra.

   Cualquier otra dirección que no exista ve la página de siempre, abajo.
   ===================================================================== */
(function(){
  try{
    var partes = location.pathname.split('/').filter(Boolean);
    // Se espera: ["promotores", "CODIGO"]  (o "promotor")
    if(partes.length >= 2){
      var carpeta = partes[partes.length - 2].toLowerCase();
      var codigo  = partes[partes.length - 1].toUpperCase();
      if((carpeta === 'promotores' || carpeta === 'promotor') && /^[A-Z0-9]{4,16}$/.test(codigo)){
        var base = '/' + partes.slice(0, -1).join('/') + '/';
        location.replace(base + '?c=' + encodeURIComponent(codigo) + location.hash);
        return;
      }
    }
  }catch(e){ /* si algo falla, se muestra la página normal */ }
})();
</script>
<style>
  :root{
    --brand:#25D366; --brand-2:#1DAF5A; --brand-soft:#E5FAEC; --brand-ink:#0E7A3D;
    --bg:#F3F4FA; --surface:#FFFFFF; --surface-alt:#EEF0F7;
    --ink:#16213E; --ink-soft:#8A93AC; --border:#E4E7F1;
    --sans:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:var(--sans); background:var(--bg); color:var(--ink);
    min-height:100dvh; display:grid; place-items:center; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .caja{
    background:var(--surface); border:1px solid var(--border); border-radius:18px;
    box-shadow:0 1px 2px rgba(22,33,62,.04), 0 6px 18px rgba(22,33,62,.05);
    padding:32px 26px; max-width:420px; width:100%; text-align:center;
  }
  .logo{
    width:46px; height:46px; border-radius:14px; margin:0 auto 18px;
    background:linear-gradient(145deg, var(--brand), var(--brand-2));
    display:grid; place-items:center; color:#fff;
  }
  .logo svg{ width:25px; height:25px; }
  h1{ font-size:21px; font-weight:800; letter-spacing:-.5px; margin:0 0 9px; }
  p{ font-size:14.5px; font-weight:500; color:var(--ink-soft); line-height:1.6; margin:0 0 22px; }
  a.btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:100%; padding:16px 20px; border-radius:14px;
    background:var(--brand); color:#fff; font-size:16px; font-weight:700;
    text-decoration:none;
  }
  a.btn:active{ transform:scale(.985); }
</style>
</head>
<body>
  <div class="caja">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>
    </div>
    <h1>No encontramos esta página</h1>
    <p>Puede que el enlace esté mal escrito o que la página haya cambiado de lugar.</p>
    <a class="btn" href="/">Ir al inicio</a>
  </div>
</body>
</html>
