:root{
  /* Tinta: un solo azul marino en tres pasos */
  --ink:#16213E;
  --ink-soft:#8A93AC;
  --ink-faint:#C9CEDD;

  /* Superficies planas: tarjeta blanca sobre gris casi blanco */
  --bg:#FAFAFB;
  --surface:#FFFFFF;
  --surface-alt:#F2F4F8;
  --border:#E8EBF2;
  --border-fuerte:#DFE3EC;

  /* Verde de marca, más apagado que el de la app */
  --brand:#4FBF62;
  --brand-2:#3BA94F;
  --brand-soft:#E6F6EB;
  --brand-ink:#0C7A2F;

  /* Ámbar para transacciones */
  --amar-soft:#FDF2DA;
  --amar-ink:#7A4D10;

  /* Avisos */
  --rojo:#C0453A;
  --rojo-soft:#FBEDEB;
  --exito:#0C7A2F;
  --exito-soft:#E6F6EB;

  --radius-card:16px;
  --radius-btn:11px;
  --radius-chip:999px;
  --shadow-card:0 1px 2px rgba(17,31,67,.04);
  --shadow-pop:0 8px 24px rgba(17,31,67,.10);
  --sans:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono:'SFMono-Regular', ui-monospace, 'Courier New', Courier, monospace;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  font-family:VPInter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; font-size:15px;
}
button{ cursor:pointer; font-family:inherit; }
a{ color:inherit; }

/* ---------- Entrar ---------- */
.entrar{ min-height:100dvh; display:grid; place-items:center; padding:24px; }
.entrar-caja{ width:100%; max-width:380px; }
.marca{ font-size:26px; font-weight:800; letter-spacing:-.6px; text-align:center; margin:0 0 4px; }
.marca i{ font-style:normal; color:var(--brand-2); }
.entrar-sub{ text-align:center; font-size:14px; font-weight:500; color:var(--ink-soft); margin:0 0 26px; }
.campo{ margin-bottom:14px; }
.campo label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:7px; }
.entrada{
  width:100%; height:46px; border:1.6px solid var(--border); border-radius:13px;
  padding:0 14px; font-size:15px; font-weight:600; color:var(--ink);
  background:var(--surface); font-family:inherit;
}
.entrada:focus{ outline:none; border-color:var(--brand); }
.btn-verde{
  width:100%; height:48px; border:none; border-radius:13px; margin-top:6px;
  background:#25D366; color:#fff; font-size:16px; font-weight:700;
  box-shadow:0 8px 20px rgba(37,211,102,.28);
}
.btn-verde:active{ background:#1FBE5A; }
.btn-verde:disabled{ opacity:.55; box-shadow:none; }

/* ---------- Panel ---------- */
.barra{
  position:sticky; top:0; z-index:10; background:var(--surface);
  border-bottom:1px solid var(--border); padding:13px 20px;
  display:flex; align-items:center; gap:14px;
}
.barra h1{ font-size:17px; font-weight:800; margin:0; letter-spacing:-.3px; }
.barra .quien{ margin-left:auto; font-size:13px; font-weight:600; color:var(--ink-soft); }
.barra button{
  border:1px solid var(--border-fuerte); background:var(--surface); color:var(--ink);
  border-radius:10px; padding:7px 12px; font-size:13px; font-weight:700;
}
.hoja{ max-width:1000px; margin:0 auto; padding:22px 20px 60px; }

.tarjetas{ display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; margin-bottom:22px; }
.dato{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:15px 16px; }
.dato b{ display:block; font-size:24px; font-weight:800; letter-spacing:-.6px; }
.dato span{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-top:3px; }
.dato.ok b{ color:var(--brand-ink); }

.filtros{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.filtros button{
  border:1px solid var(--border-fuerte); background:var(--surface); color:var(--ink-soft);
  border-radius:999px; padding:8px 15px; font-size:13.5px; font-weight:700;
}
.filtros button.sel{ background:var(--ink); color:#fff; border-color:var(--ink); }

.sol{
  background:var(--surface); border:1px solid var(--border); border-radius:18px;
  padding:18px; margin-bottom:14px;
}
.sol-cab{ display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap; }
.sol-quien b{ display:block; font-size:16.5px; font-weight:800; letter-spacing:-.3px; }
.sol-quien > span{ display:block; font-size:13px; font-weight:500; color:var(--ink-soft); margin-top:2px; }
.sol-quien .eti{ display:inline-block; }
.sol-monto{ margin-left:auto; text-align:right; }
.sol-monto b{ display:block; font-size:25px; font-weight:800; letter-spacing:-.8px; }
.sol-monto span{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); }
.eti{ display:inline-block; font-size:11.5px; font-weight:800; border-radius:999px; padding:4px 10px; }
.eti.esp{ background:#FDF2DA; color:#7A4D10; }
.eti.pag{ background:#E6F6EB; color:#0C7A2F; }
.eti.rec{ background:#FBEDEB; color:#C0453A; }

.cuenta{
  background:var(--surface-alt); border-radius:14px; padding:14px 15px; margin:15px 0 0;
  display:grid; grid-template-columns:repeat(auto-fit, minmax(185px, 1fr)); gap:12px 18px;
}
.cuenta div span{ display:block; font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:3px; }
.cuenta div b{ font-size:14.5px; font-weight:700; word-break:break-all; }
.clabe-fila{ display:flex; align-items:center; gap:8px; }
.clabe-fila b{ font-variant-numeric:tabular-nums; letter-spacing:.2px; }
.copiar{
  border:1px solid var(--border-fuerte); background:var(--surface); color:var(--ink);
  border-radius:8px; padding:4px 9px; font-size:11.5px; font-weight:700; flex:none;
}
.wa{ color:#0C7A2F; font-weight:800; text-decoration:none; }

.acciones{ display:flex; gap:10px; margin-top:15px; flex-wrap:wrap; }
.acciones button{ border:none; border-radius:12px; padding:12px 18px; font-size:14.5px; font-weight:700; }
.b-pagar{ background:#25D366; color:#fff; }
.b-rechazar{ background:var(--surface); color:var(--rojo); border:1.5px solid #F2D8D5 !important; }
.nota{ font-size:13px; font-weight:500; color:var(--ink-soft); margin:12px 0 0; }
.vacio{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-weight:600; }

.aviso{
  position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:12px 18px; font-size:14.5px; font-weight:700;
  box-shadow:0 14px 34px rgba(22,33,62,.18); opacity:0; pointer-events:none;
  transition:opacity .2s ease; z-index:50; max-width:90%;
}
.aviso.ver{ opacity:1; }
.aviso.mal{ color:var(--rojo); }
@media (max-width:640px){
  .sol-monto{ margin-left:0; text-align:left; width:100%; }
  .hoja{ padding:18px 14px 50px; }
  .barra{ padding:11px 14px; gap:8px; }
  .barra h1{ font-size:15.5px; }
  .barra .quien{ display:none; }
  .barra button{ margin-left:auto; }
  .barra button + button{ margin-left:0; }
}
</style>
</head>

<div class="aviso" id="aviso"></div>

const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
  auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:false,
          storageKey:'vp-admin-auth' }
});

const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const pesos = c => '$' + (Number(c || 0) / 100).toLocaleString('es-MX',
  { minimumFractionDigits:2, maximumFractionDigits:2 });
const fecha = t => t ? new Date(t).toLocaleString('es-MX',
  { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '';

let avisoT;
function aviso(txt, mal){
  const a = $('aviso');
  a.textContent = txt;
  a.className = 'aviso ver' + (mal ? ' mal' : '');
  clearTimeout(avisoT);
  avisoT = setTimeout(() => { a.className = 'aviso' + (mal ? ' mal' : ''); }, 3200);
}

const S = { correo:'', filtro:'solicitado', datos:null, yo:'' };

/* ---------------------------------------------------------------- */
function pantallaEntrar(){
  return `
    <div class="entrar">
      <div class="entrar-caja">
        <h1 class="marca">Vendo<i>Plus</i></h1>
        <p class="entrar-sub">Panel de retiros de promotores</p>
        <div class="campo">
          <label for="eCorreo">Correo</label>
          <input class="entrada" id="eCorreo" type="email" autocomplete="username"
                 placeholder="tucorreo@gmail.com" value="${esc(S.correo)}">
        </div>
        <div class="campo">
          <label for="ePw">Contraseña</label>
          <input class="entrada" id="ePw" type="password" autocomplete="current-password"
                 placeholder="••••••••">
        </div>
        <button class="btn-verde" id="bEntrar">Entrar</button>
      </div>
    </div>`;
}

function pantallaPanel(){
  const d = S.datos || {};
  const r = d.resumen || {};
  const lista = d.solicitudes || [];
  const titulo = { solicitado:'Esperando pago', pagado:'Ya pagadas',
                   rechazado:'Rechazadas', todas:'Todas' }[S.filtro] || '';

  return `
    <div class="barra">
      <h1>Retiros de promotores</h1>
      <span class="quien">${esc(S.yo)}</span>
      <button id="bRecargar">Actualizar</button>
      <button id="bSalir">Salir</button>
    </div>

    <div class="hoja">
      <div class="tarjetas">
        <div class="dato"><b>${r.esperando || 0}</b><span>Esperando pago</span></div>
        <div class="dato"><b>${pesos(r.esperando_cents)}</b><span>Por entregar</span></div>
        <div class="dato ok"><b>${pesos(r.pagado_cents)}</b><span>Ya entregado</span></div>
        <div class="dato"><b>${r.pagadas || 0}</b><span>Retiros pagados</span></div>
      </div>

      <div class="filtros">
        ${['solicitado','pagado','rechazado','todas'].map(f => `
          <button data-f="${f}" class="${S.filtro === f ? 'sel' : ''}">
            ${ { solicitado:'Esperando', pagado:'Pagadas', rechazado:'Rechazadas', todas:'Todas' }[f] }
          </button>`).join('')}
      </div>

      ${lista.length ? lista.map(tarjeta).join('') : `
        <p class="vacio">No hay solicitudes en "${esc(titulo)}".</p>`}
    </div>`;
}

function tarjeta(s){
  const p = s.promotor || {};
  const esperando = s.estado === 'solicitado';
  const eti = s.estado === 'pagado' ? '<span class="eti pag">Pagada</span>'
            : s.estado === 'rechazado' ? '<span class="eti rec">Rechazada</span>'
            : '<span class="eti esp">Esperando</span>';
  const wa = String(p.whatsapp || '').replace(/\D/g, '');
  const waLink = wa ? (wa.length === 10 ? '52' + wa : wa) : '';

  return `
    <div class="sol">
      <div class="sol-cab">
        <div class="sol-quien">
          <b>${esc(p.nombre || 'Sin nombre')}</b>
          <span>${esc(p.correo || '')} · código ${esc(p.codigo || '')}</span>
          <span style="margin-top:6px;">${eti}</span>
        </div>
        <div class="sol-monto">
          <b>${pesos(s.importe_cents)}</b>
          <span>${s.seccion === 'bonos'
            ? ('Bonos · ' + (s.renovaciones || 0) + ' renovaciones')
            : 'Comisiones por negocios nuevos'}</span>
          <span>Pedido el ${esc(fecha(s.creado_en))}</span>
        </div>
      </div>

      <div class="cuenta">
        <div><span>Nombre de quien recibe</span><b>${esc(p.titular || '—')}</b></div>
        <div><span>Banco</span><b>${esc(p.banco || '—')}</b></div>
        <div>
          <span>CLABE</span>
          <div class="clabe-fila">
            <b>${esc(p.clabe || '—')}</b>
            ${p.clabe ? `<button class="copiar" data-copiar="${esc(p.clabe)}">Copiar</button>` : ''}
          </div>
        </div>
        <div>
          <span>WhatsApp</span>
          <b>${waLink
            ? `<a class="wa" href="https://wa.me/${waLink}" target="_blank" rel="noopener">${esc(p.whatsapp)}</a>`
            : '—'}</b>
        </div>
      </div>

      ${esperando ? `
        <div class="acciones">
          <button class="b-pagar" data-pagar="${s.id}" data-monto="${s.importe_cents}">Ya le deposité</button>
          <button class="b-rechazar" data-rechazar="${s.id}">Rechazar</button>
        </div>` : `
        <p class="nota">${s.estado === 'pagado' ? 'Pagada' : 'Rechazada'} el ${esc(fecha(s.resuelto_en))}${
          s.nota ? ' · ' + esc(s.nota) : ''}</p>`}
    </div>`;
}

/* ---------------------------------------------------------------- */
function pintar(){
  $('app').innerHTML = S.datos ? pantallaPanel() : pantallaEntrar();
  cablear();
}

function cablear(){
  if(!S.datos){
    $('bEntrar').onclick = entrar;
    $('ePw').onkeydown = ev => { if(ev.key === 'Enter') entrar(); };
    return;
  }
  $('bRecargar').onclick = () => cargar();
  $('bSalir').onclick = async () => {
    await sb.auth.signOut().catch(() => {});
    S.datos = null; S.yo = '';
    pintar();
  };
  document.querySelectorAll('[data-f]').forEach(b => {
    b.onclick = () => { S.filtro = b.dataset.f; cargar(); };
  });
  document.querySelectorAll('[data-copiar]').forEach(b => {
    b.onclick = async () => {
      try{ await navigator.clipboard.writeText(b.dataset.copiar); aviso('CLABE copiada'); }
      catch(e){ aviso('No se pudo copiar', true); }
    };
  });
  document.querySelectorAll('[data-pagar]').forEach(b => {
    b.onclick = () => resolver(b.dataset.pagar, 'pagado',
      '¿Confirmas que ya le depositaste ' + pesos(b.dataset.monto) + '?');
  });
  document.querySelectorAll('[data-rechazar]').forEach(b => {
    b.onclick = () => {
      const nota = prompt('¿Por qué la rechazas? (el saldo regresa al promotor)');
      if(nota === null) return;
      resolver(b.dataset.rechazar, 'rechazado', null, nota);
    };
  });
}

async function entrar(){
  const correo = ($('eCorreo').value || '').trim().toLowerCase();
  const pw = $('ePw').value || '';
  if(!correo || !pw) return aviso('Escribe tu correo y tu contraseña', true);
  const b = $('bEntrar');
  b.disabled = true; b.textContent = 'Entrando…';
  const { error } = await sb.auth.signInWithPassword({ email:correo, password:pw });
  b.disabled = false; b.textContent = 'Entrar';
  if(error){
    return aviso(/invalid login/i.test(error.message)
      ? 'Correo o contraseña incorrectos' : error.message, true);
  }
  S.correo = correo;
  await cargar();
}

async function cargar(){
  const r = await sb.rpc('ref_admin_solicitudes', { p_estado: S.filtro });
  if(r.error) return aviso(r.error.message, true);
  if(!r.data || !r.data.ok){
    await sb.auth.signOut().catch(() => {});
    S.datos = null;
    pintar();
    return aviso((r.data && r.data.mensaje) || 'Esta página es solo para administradores.', true);
  }
  const { data } = await sb.auth.getUser();
  S.yo = (data && data.user && data.user.email) || '';
  S.datos = r.data;
  pintar();
}

async function resolver(id, estado, confirmar, nota){
  if(confirmar && !window.confirm(confirmar)) return;
  const r = await sb.rpc('ref_admin_resolver',
    { p_id: Number(id), p_estado: estado, p_nota: nota || null });
  if(r.error) return aviso(r.error.message, true);
  if(!r.data || !r.data.ok) return aviso((r.data && r.data.mensaje) || 'No se pudo.', true);
  aviso(r.data.mensaje);
  await cargar();
}

(async function arrancar(){
  const { data } = await sb.auth.getSession();
  if(data && data.session) await cargar();
  else pintar();
})();
</script>
</body>
</html>
