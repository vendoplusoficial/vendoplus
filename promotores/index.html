<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">

<meta name="robots" content="noindex, nofollow">
<title>Promotores · VendoPlus</title>

<style>
/* =====================================================================
   PORTAL DE PROMOTORES · VENDOPLUS
   Tipografía delgada y paleta sobria. La tinta, los grises y los verdes
   se tomaron de la referencia aprobada.

   Escala de peso (a propósito corta):
     400  texto corrido
     500  etiquetas y campos
     600  títulos y botones
     700  solo la cifra del saldo
   ===================================================================== */
:root{
  /* Tinta: un solo azul marino en tres pasos */
  --ink:#16213E;
  --ink-soft:#8A93AC;
  --ink-faint:#C9CEDD;

  /* Superficies planas: tarjeta blanca sobre gris casi blanco */
  --bg:#FAFAFB;
  --surface:#FFFFFF;
  --surface-alt:#F2F4F8;
  --border:#E8EBF2;
  --border-fuerte:#DFE3EC;

  /* Verde de marca, más apagado que el de la app */
  --brand:#4FBF62;
  --brand-2:#3BA94F;
  --brand-soft:#E6F6EB;
  --brand-ink:#0C7A2F;

  /* Ámbar para transacciones */
  --amar-soft:#FDF2DA;
  --amar-ink:#7A4D10;

  /* Avisos */
  --rojo:#C0453A;
  --rojo-soft:#FBEDEB;
  --exito:#0C7A2F;
  --exito-soft:#E6F6EB;

  --radius-card:16px;
  --radius-btn:11px;
  --radius-chip:999px;
  --shadow-card:0 1px 2px rgba(17,31,67,.04);
  --shadow-pop:0 8px 24px rgba(17,31,67,.10);
  --sans:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono:'SFMono-Regular', ui-monospace, 'Courier New', Courier, monospace;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--sans); background:var(--bg); color:var(--ink);
  font-size:15px; font-weight:400; line-height:1.55;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  overscroll-behavior-y:none;
}
/* Sin esto, iOS pinta el texto de los <button> en azul de sistema. */
button{ font-family:inherit; color:inherit; cursor:pointer; -webkit-appearance:none; appearance:none; }
a{ color:var(--brand-ink); }

.wrap{ max-width:560px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; }

/* ---------- Encabezado ---------- */
.top{
  display:flex; align-items:center; gap:12px;
  padding:calc(env(safe-area-inset-top) + 15px) 18px 14px;
  background:var(--surface); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:20;
}
.top h1{ font-size:19px; font-weight:600; margin:0; flex:1; letter-spacing:-.2px; }
.top .marca{ display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
.logo{
  width:32px; height:32px; border-radius:10px; flex:none;
  background:linear-gradient(145deg, var(--brand), var(--brand-2));
  display:grid; place-items:center; color:#fff;
}
.logo svg{ width:17px; height:17px; }
.icon-btn{
  width:38px; height:38px; border-radius:10px; border:none; flex:none;
  background:var(--surface-alt); color:var(--ink-soft); display:grid; place-items:center;
}
.icon-btn:active{ transform:scale(.94); }
.icon-btn svg{ width:19px; height:19px; }
.back{ background:var(--surface-alt); color:var(--ink); }

/* ---------- Cuerpo ---------- */
.body{ flex:1; padding:18px 16px calc(env(safe-area-inset-bottom) + 92px); }
/* Entrada de cada pantalla: la misma de tu app (sube desde abajo). */
@keyframes entra{
  from{ opacity:0; transform:translate3d(0, 28px, 0); }
  to  { opacity:1; transform:translate3d(0, 0, 0); }
}
#app.entra > *{ animation:entra .55s cubic-bezier(.22, 1, .36, 1) both; }
@media (prefers-reduced-motion:reduce){
  #app.entra > *{ animation:none !important; }
}

/* ---------- Tarjetas ---------- */
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-card); box-shadow:var(--shadow-card);
  padding:18px 17px; margin-bottom:12px;
}
.card.tap{
  width:100%; text-align:left; display:block;
  color:var(--ink); font-size:15px;      /* el botón hereda la tinta, no el azul de iOS */
}
.card.tap:active{ background:#FCFCFD; }
.card-top{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.card-ico{
  width:36px; height:36px; border-radius:10px; flex:none; display:grid; place-items:center;
  background:var(--brand-soft); color:var(--brand-ink);
}
.card-ico.teal{ background:var(--brand-soft); color:var(--brand-ink); }
.card-ico.amar{ background:var(--amar-soft); color:var(--amar-ink); }
.card-ico svg{ width:18px; height:18px; }
.card-title{ font-size:16px; font-weight:600; margin:0; letter-spacing:-.15px; color:var(--ink); }
.card-note{ font-size:14px; font-weight:400; color:var(--ink-soft); margin:0; line-height:1.55; }
.chev{ margin-left:auto; color:var(--ink-faint); display:grid; place-items:center; }
.chev svg{ width:17px; height:17px; }

/* ---------- Enlace de invitación ---------- */
.enlace-caja{
  display:flex; align-items:center; gap:10px;
  background:var(--surface-alt); border:1px dashed var(--border-fuerte);
  border-radius:12px; padding:10px 11px; margin-bottom:12px;
}
.enlace-txt{
  flex:1; min-width:0; font-family:var(--mono); font-size:13px; font-weight:500;
  color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.btn-copiar{
  flex:none; border:none; border-radius:9px; padding:10px 14px;
  background:var(--ink); color:#fff; font-size:13.5px; font-weight:600;
  display:inline-flex; align-items:center; gap:7px;
}
.btn-copiar svg{ width:15px; height:15px; }
.btn-copiar.ok{ background:var(--exito); }

/* ---------- Cartera ---------- */
.saldo{ display:flex; align-items:baseline; gap:8px; margin:3px 0 2px; }
.saldo-num{ font-size:36px; font-weight:700; letter-spacing:-1.1px; line-height:1.05; color:var(--ink); }
.saldo-mon{ font-size:14px; font-weight:500; color:var(--ink-soft); }
.saldo-et{ font-size:13.5px; font-weight:500; color:var(--ink-soft); margin:0 0 3px; }

/* ---------- Desglose ---------- */
.fila{
  display:flex; align-items:center; gap:12px;
  padding:14px 0; border-bottom:1px solid var(--border);
}
.fila:last-child{ border-bottom:none; }
.fila-txt{ flex:1; min-width:0; }
.fila-t{ font-size:15px; font-weight:500; margin:0; color:var(--ink); }
.fila-s{ font-size:13px; font-weight:400; color:var(--ink-soft); margin:2px 0 0; line-height:1.5; }
.fila-n{ font-size:15px; font-weight:600; flex:none; white-space:nowrap; color:var(--ink); }
.fila-n.verde{ color:var(--brand-ink); }
.fila-n.gris{ color:var(--ink-soft); }
.fila-n.roja{ color:var(--rojo); }

/* ---------- Etiquetas de estado ---------- */
.tag{
  display:inline-flex; align-items:center; gap:5px;
  font-size:11.5px; font-weight:500; padding:4px 10px; border-radius:var(--radius-chip);
  background:var(--surface-alt); color:var(--ink-soft); white-space:nowrap;
}
.tag.disp{ background:var(--exito-soft); color:var(--brand-ink); }
.tag.gen{ background:var(--amar-soft); color:var(--amar-ink); }
.tag.proc{ background:var(--surface-alt); color:var(--ink-soft); }
.tag.canc{ background:var(--rojo-soft); color:var(--rojo); }

/* ---------- Barra de progreso ---------- */
.barra{ height:6px; border-radius:99px; background:var(--surface-alt); overflow:hidden; margin-top:10px; }
.barra i{ display:block; height:100%; border-radius:99px; background:var(--brand-ink); }

/* ---------- Botones ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:none; border-radius:var(--radius-btn);
  padding:14px 18px; font-size:15px; font-weight:600;
  background:var(--surface-alt); color:var(--ink);
}
.btn svg{ width:17px; height:17px; }
.btn.dark{ background:var(--ink); color:#fff; }
.btn.primary{ background:var(--ink); color:#fff; }
.btn.ghost{ background:var(--surface); border:1px solid var(--border-fuerte); color:var(--ink); }
.btn.block{ width:100%; }
.btn.xl{ padding:16px 20px; font-size:16px; border-radius:13px; }
.btn:disabled{ opacity:.55; }
.btn:not(:disabled):active{ transform:scale(.985); }
.btn.bloq{ background:var(--surface-alt); color:var(--ink-faint); }

/* ---------- Formularios ---------- */
.field{ margin-bottom:16px; text-align:left; }
.field label{ display:block; font-size:13px; font-weight:500; color:var(--ink-soft); margin-bottom:8px; }
.entrada{
  width:100%; border:1px solid var(--border-fuerte); border-radius:12px;
  padding:14px 15px; font-size:16px; font-weight:500;
  color:var(--ink); background:var(--surface); font-family:inherit;
}
.entrada::placeholder{ color:var(--ink-faint); font-weight:400; }
.entrada:focus{ outline:none; border-color:var(--ink-faint); }
.pw-caja{ position:relative; }
.pw-ojo{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  width:40px; height:40px; border:none; background:none; color:var(--ink-faint);
  display:grid; place-items:center; border-radius:10px;
}
.pw-ojo svg{ width:19px; height:19px; }

.otp-row{ display:flex; gap:9px; justify-content:space-between; margin:6px 0 18px; }
.otp-cell{
  flex:1; min-width:0; aspect-ratio:1 / 1.18;
  border:1px solid var(--border-fuerte); border-radius:13px;
  background:var(--surface); font-family:inherit;
  font-size:23px; font-weight:600; text-align:center; color:var(--ink);
  padding:0; -moz-appearance:textfield;
}
.otp-cell::-webkit-outer-spin-button, .otp-cell::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.otp-cell:focus{ border-color:var(--ink); outline:none; }
.otp-cell.filled{ border-color:var(--ink-faint); }
.otp-row.error .otp-cell{ border-color:var(--rojo); animation:shake .32s ease; }
@keyframes shake{ 10%,90%{transform:translateX(-2px)} 30%,70%{transform:translateX(3px)} 50%{transform:translateX(-3px)} }
.otp-help{ font-size:13.5px; font-weight:400; color:var(--ink-soft); text-align:center; margin:0; }
.otp-help button{ border:none; background:none; color:var(--ink); font-weight:600; text-decoration:underline; padding:0; font-size:13.5px; }
.otp-help button:disabled{ color:var(--ink-faint); text-decoration:none; }

/* ---------- Pantallas de acceso ---------- */
.acceso{ background:var(--surface); min-height:100dvh; display:flex; flex-direction:column; }
.acceso-in{ padding:calc(env(safe-area-inset-top) + 22px) 22px 32px; max-width:440px; margin:0 auto; width:100%; }
.acceso-ilu{ display:grid; place-items:center; margin:10px 0 20px; }
.acceso-ilu svg{ width:104px; height:104px; }
.tit{ font-size:24px; font-weight:600; letter-spacing:-.5px; margin:4px 0 9px; text-align:center; color:var(--ink); }
.sub{ font-size:15px; font-weight:400; color:var(--ink-soft); line-height:1.6; margin:0 0 22px; text-align:center; }
.cambia{ text-align:center; font-size:14px; font-weight:400; color:var(--ink-soft); margin:16px 0 0; }
.cambia button{ border:none; background:none; color:var(--ink); font-weight:600; font-size:14px; padding:0; text-decoration:underline; }
.aviso-correo{ font-size:13px; font-weight:400; color:var(--ink-soft); text-align:center; margin:-8px 0 14px; }

/* ---------- Ayuda ---------- */
.fab{
  position:fixed; right:max(16px, calc(50% - 280px + 16px));
  bottom:calc(env(safe-area-inset-bottom) + 20px);
  width:50px; height:50px; border-radius:50%; z-index:30;
  background:var(--surface); color:var(--brand-ink);
  box-shadow:var(--shadow-pop); display:grid; place-items:center;
  border:1px solid var(--border);
}
.fab:active{ transform:scale(.93); }
.fab svg{ width:23px; height:23px; }

.ay-h{ font-size:16px; font-weight:600; margin:24px 0 8px; letter-spacing:-.15px; color:var(--ink); }
.ay-h:first-child{ margin-top:0; }
.ay-p{ font-size:14.5px; font-weight:400; color:var(--ink-soft); line-height:1.65; margin:0 0 10px; }
.ay-p b{ color:var(--ink); font-weight:600; }
.ay-ej{
  background:var(--surface-alt); border-radius:12px; padding:13px 14px; margin:10px 0 4px;
  font-size:13.5px; font-weight:400; color:var(--ink-soft); line-height:1.7;
}
.ay-ej b{ color:var(--ink); font-weight:600; }

/* ---------- Avisos ---------- */
.vacio{ text-align:center; padding:34px 18px; }
.vacio svg{ width:72px; height:72px; margin-bottom:12px; }
.vacio p{ font-size:14.5px; font-weight:400; color:var(--ink-soft); margin:0; line-height:1.6; }

.aviso{
  display:flex; gap:11px; align-items:flex-start;
  background:var(--amar-soft); border-radius:12px; padding:13px 14px; margin-bottom:13px;
}
.aviso svg{ width:18px; height:18px; flex:none; color:var(--amar-ink); margin-top:1px; }
.aviso p{ margin:0; font-size:13.5px; font-weight:400; color:var(--amar-ink); line-height:1.55; }

.toast{
  position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 86px);
  transform:translateX(-50%) translateY(14px); z-index:60;
  background:#fff; color:var(--ink); border:1px solid var(--border); border-radius:16px;
  padding:10px 15px 10px 11px; width:max-content; max-width:calc(100% - 32px);
  box-shadow:0 14px 34px rgba(22,33,62,.18);
  opacity:0; pointer-events:none; transition:opacity .22s ease, transform .22s ease;
  display:flex; align-items:center; gap:11px; text-align:left;
}
.toast.ver{ opacity:1; transform:translateX(-50%) translateY(0); }
.toast-ico{
  width:38px; height:38px; border-radius:50%; flex:none;
  display:grid; place-items:center; background:#E6F8EE; color:#12A150;
}
.toast.mal .toast-ico{ background:#FDEBEB; color:#D94A4A; }
.toast-ico svg{ width:20px; height:20px; }
.toast-tx{ min-width:0; }
.toast-tx b{ display:block; font-size:14.5px; font-weight:800; line-height:1.25; color:var(--ink); }
.toast-tx i{
  display:block; font-style:normal; font-size:12.8px; font-weight:500;
  line-height:1.3; margin-top:3px; color:var(--ink-soft);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

.cargando{ display:grid; place-items:center; min-height:100dvh; }
.spin{
  width:28px; height:28px; border-radius:50%;
  border:2.5px solid var(--border); border-top-color:var(--ink-faint);
  animation:gira .8s linear infinite;
}
@keyframes gira{ to{ transform:rotate(360deg); } }

.vivo{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11.5px; font-weight:500; color:var(--ink-faint);
}
.vivo i{ width:6px; height:6px; border-radius:50%; background:var(--ink-faint); }
.vivo.on i{ background:var(--brand-ink); animation:late 2s ease-in-out infinite; }
@keyframes late{ 50%{ opacity:.35; } }

/* ---------- Invitación del promotor ---------- */
.inv{ padding:calc(env(safe-area-inset-top) + 18px) 20px 36px; max-width:460px; margin:0 auto; width:100%; }
.inv-top{ margin-bottom:14px; }
.inv-de{ font-size:13.5px; font-weight:400; color:var(--ink-soft); }
.inv-de b{ color:var(--ink); font-weight:600; }
.inv-vuelta{ margin:0 0 12px; }
.inv-ilu{ margin:6px 0 20px; }
.inv-ilu svg{ width:100%; height:auto; display:block; }
.inv-tit{ font-size:23px; font-weight:600; letter-spacing:-.5px; margin:0 0 9px; color:var(--ink); text-align:center; }
.inv-sub{ font-size:15px; font-weight:400; color:var(--ink-soft); line-height:1.6; margin:0 0 13px; text-align:center; }
.inv-nota{
  font-size:13px; font-weight:400; color:var(--ink-soft); line-height:1.5; text-align:center;
  background:var(--surface-alt); border-radius:10px; padding:11px 13px; margin:0 0 22px;
}
.inv-acciones{ display:grid; gap:10px; }
.inv-pie{
  margin:26px 0 0; font-size:12.5px; font-weight:400; color:var(--ink-faint);
  display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
}
.inv-pie a{ color:var(--ink-soft); text-decoration:underline; }
.inv-pie i{ width:3px; height:3px; border-radius:50%; background:var(--ink-faint); display:inline-block; }

/* ---------- Precios de la membresía ---------- */
.precio{ display:flex; align-items:center; gap:10px; margin-bottom:3px; }
.precio-antes{ font-size:15px; font-weight:400; color:var(--ink-faint); text-decoration:line-through; }
.precio-chip{
  font-size:11.5px; font-weight:600; color:#fff; background:var(--brand-ink);
  border-radius:var(--radius-chip); padding:3px 9px;
}
.precio-ahora{ display:flex; align-items:baseline; gap:8px; }
.precio-num{ font-size:32px; font-weight:700; letter-spacing:-1px; color:var(--ink); line-height:1.1; }
.precio-et{ font-size:13.5px; font-weight:500; color:var(--ink-soft); }

/* =====================================================================
   PANTALLA GRANDE
   Solo adaptación: el mismo diseño de siempre, aprovechando el ancho.
   En celular no cambia absolutamente nada.
   ===================================================================== */
@media (min-width:900px){
  /* Acceso e invitación: la columna se centra en la pantalla y se apoya
     en una tarjeta, en vez de quedar estirada arriba a la izquierda. */
  .acceso{ background:var(--bg); display:grid; place-items:center; padding:40px 20px; }
  .acceso-in, .inv{
    background:var(--surface); border:1px solid var(--border);
    border-radius:20px; box-shadow:var(--shadow-card);
    padding:40px 38px 42px; width:100%;
  }
  .acceso-in{ max-width:470px; }
  .inv{ max-width:560px; }
  .inv-vuelta{ margin-top:-6px; }

  /* Portal del promotor: más ancho y las dos tarjetas una junto a la otra. */
  .wrap{ max-width:980px; }
  .top{ padding-left:24px; padding-right:24px; }
  .body{ padding:24px 24px 76px; }
  .rejilla{ display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start; }
  .rejilla > .card{ margin-bottom:0; }
  .fab{ right:max(24px, calc(50% - 490px + 24px)); }
}

@media (min-width:1280px){
  .wrap{ max-width:1080px; }
  .fab{ right:max(24px, calc(50% - 540px + 24px)); }
}

/* =====================================================================
   LETRAS DEL SITIO
   Es la misma Inter que ya usa vendoplusoficial.com, tomada de ahí y
   guardada dentro de este archivo: no se pide a ningún servidor.

/* =====================================================================
   ENTRAR AL PROGRAMA DE PROMOTORES
   Pantalla propia. En celular: marca, cartel de la promoción y el
   formulario, uno debajo del otro. En pantalla grande: el cartel a la
   izquierda y el formulario a la derecha. Todo con medidas flexibles
   (clamp y porcentajes) para que no se deforme en ningún tamaño.
   ===================================================================== */
.acceso.ini-pag{ display:block; background:var(--surface); padding:0; }
body, input, button, textarea{ font-family:'VPInter', var(--sans); }

.ini{ min-height:100dvh; display:flex; flex-direction:column; background:var(--surface); }

.ini-marca{
  display:flex; align-items:center; justify-content:center; gap:11px;
  padding:calc(env(safe-area-inset-top) + 26px) 22px 0;
}
.ini-logo{
  width:33px; height:33px; border-radius:10px; flex:none;
  background:#4AB54B; color:#fff; display:grid; place-items:center;
}
.ini-logo svg{ width:18px; height:18px; }
/* El rayo va macizo, como en la app. */
.ini-logo svg path{ fill:#fff; stroke-width:1.5; }
.ini-marca b{ font-size:18.5px; font-weight:700; letter-spacing:-.3px; color:var(--ink); }

.ini-cuerpo{ flex:1; width:100%; max-width:440px; margin:0 auto; padding:0 22px 40px; }

.ini-promo{ display:block; margin:18px -11px 13px; }
.ini-promo-img{ display:block; width:100%; height:auto; }

.ini-tit{
  font-size:24.5px; font-weight:700; letter-spacing:-.7px;
  color:var(--ink); text-align:center; margin:0 0 9px; line-height:1.2;
}
.ini-sub{
  font-size:14.8px; font-weight:400; color:var(--ink-soft);
  line-height:1.52; text-align:center; margin:0 0 17px;
}

.ini-campo{ margin-bottom:15px; text-align:left; }
.ini-campo label{ display:block; font-size:12.6px; font-weight:600; color:var(--ink); margin-bottom:4px; }
.ini-caja{ position:relative; display:flex; align-items:center; }
.ini-caja > svg{
  position:absolute; left:14px; width:18px; height:18px;
  color:var(--ink-faint); display:none; pointer-events:none;
}
.ini-caja input{
  width:100%; border:1px solid #E6E8F0; border-radius:12px; background:var(--surface);
  padding:12px 15px; font-family:inherit; font-size:16px; font-weight:400; color:var(--ink);
}
.ini-caja input::placeholder{ color:var(--ink-faint); font-weight:400; }
.ini-caja input:focus{ outline:none; border-color:var(--ink-faint); }
.ini-caja.pw input{ padding-right:50px; }
.ini-caja .pw-ojo{ right:7px; }

.ini-entrar{
  width:100%; border:none; border-radius:12px; margin-top:3px;
  background:#122244; color:#fff; font-family:inherit;
  padding:14px 18px; font-size:15.5px; font-weight:700; letter-spacing:-.1px;
}
.ini-entrar:disabled{ opacity:.55; }
.ini-entrar:not(:disabled):active{ transform:scale(.99); }

.ini-olvide{ text-align:center; margin:13px 0 0; }
.ini-olvide button{
  border:none; background:none; padding:0;
  font-size:14.1px; font-weight:700; color:var(--ink);
  text-decoration:underline; text-underline-offset:3px;
}

/* --- Tablet y computadora: cartel a la izquierda, formulario a la derecha --- */
@media (min-width:860px){
  .ini-marca{
    justify-content:flex-start; width:100%; max-width:1240px;
    margin:0 auto; padding:20px clamp(20px, 2.6vw, 36px) 0;
  }
  .ini-cuerpo{
    max-width:1240px; padding:0 clamp(20px, 2.6vw, 36px) 24px;
    display:grid; grid-template-columns:minmax(0, 1.04fr) minmax(0, 1fr);
    gap:clamp(26px, 4vw, 60px); align-items:center;
  }
  /* El cartel cuadrado nunca pasa de lo que cabe en la pantalla, así que
     la página entra completa y no hay que deslizar. */
  .ini-promo{ margin:0; display:grid; place-items:center; }
  .ini-promo-img{ width:auto; max-width:100%; max-height:calc(100dvh - 150px); }

  .ini-form{ width:100%; max-width:470px; margin:0 auto; }
  .ini-caja > svg{ display:block; }
  .ini-caja input{ padding-left:44px; }
}

/* =====================================================================
   PANTALLA PRINCIPAL DEL PROMOTOR
   Medidas tomadas de las imágenes de referencia.
   ===================================================================== */
.top.pri{
  background:#FBFAFF; border-bottom:none; gap:0;
  padding:calc(env(safe-area-inset-top) + 20px) 18px 14px;
}
.wrap.pri-pag{ background:#FBFAFF; }
.pri-logo{
  width:33px; height:33px; border-radius:10px; flex:none;
  background:#4AB54B; color:#fff; display:grid; place-items:center;
}
.pri-logo svg{ width:18px; height:18px; }
.pri-logo svg path{ fill:#fff; stroke-width:1.5; }
.pri-marca{ margin-left:11px; flex:1; min-width:0; }
.pri-marca b{ display:block; font-size:19px; font-weight:700; letter-spacing:-.3px; color:var(--ink); line-height:1.18; }
.pri-marca span{ display:block; font-size:12.5px; font-weight:400; color:var(--ink-soft); line-height:1.25; }

.vivo{
  display:inline-flex; align-items:center; gap:7px; flex:none;
  height:31px; padding:0 11.5px; border-radius:var(--radius-chip);
  background:var(--surface-alt); color:var(--ink-faint);
  font-size:12.5px; font-weight:600;
}
.vivo.on{ background:#EFF8F2; color:var(--brand-ink); }
.vivo i{ width:6px; height:6px; border-radius:50%; background:currentColor; }
.vivo.on i{ animation:late 2s ease-in-out infinite; }
.top.pri .icon-btn{
  width:32px; height:32px; border-radius:10px; margin-left:12px;
  background:#F0F1F6; color:var(--ink);
}
.top.pri .icon-btn svg{ width:18px; height:18px; }

.body.pri{ padding:20px 16px calc(env(safe-area-inset-bottom) + 96px); }
.pri-hola{ font-size:15.2px; font-weight:500; color:var(--ink-soft); margin:0; line-height:1.15; }
.pri-tit{ font-size:25.4px; font-weight:700; letter-spacing:-.7px; color:var(--ink); margin:0; line-height:1.2; }

.pri-card{
  background:var(--surface); border:1px solid #F0F1F6; border-radius:16px;
  box-shadow:0 1px 3px rgba(17,31,67,.045);
  padding:16px 14px 19px; margin-top:10px;
}

/* ---- Banner de recompensas extra (6 → 4 → 2 negocios) ---- */
.rec{
  position:relative; margin-top:18px; overflow:hidden;
  background:var(--surface); border:1px solid #F0F1F6; border-radius:18px;
  box-shadow:0 1px 3px rgba(17,31,67,.045);
}
/* Alto FIJO: así la tarjeta mide igual esté activa, bloqueada o lograda,
   y no empuja hacia abajo el resto del resumen. */
.rec-cuerpo{
  display:flex; align-items:center; gap:8px;
  height:76px; padding:0 12px;
}
.rec.con-ant .rec-cuerpo{ padding-left:42px; }

/* La animación corre SOLO al cambiar de recompensa con las flechas.
   Si se deja en cada dibujado, parpadea cada vez que se refresca el
   resumen (y el resumen se refresca solo, en vivo). */
.rec.hacia-der .rec-cuerpo{ animation:recEntraDer .26s cubic-bezier(.22,.8,.3,1) both; }
.rec.hacia-izq .rec-cuerpo{ animation:recEntraIzq .26s cubic-bezier(.22,.8,.3,1) both; }
@keyframes recEntraDer{ from{ opacity:0; transform:translateX(16px); } to{ opacity:1; transform:none; } }
@keyframes recEntraIzq{ from{ opacity:0; transform:translateX(-16px); } to{ opacity:1; transform:none; } }

.rec-tx{ flex:1 1 auto; min-width:0; }
.rec-t{
  margin:0; font-size:13.5px; font-weight:800; line-height:1.3;
  letter-spacing:-.15px; color:var(--ink);
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;
  overflow:hidden;                       /* nunca pasa de dos renglones */
}
.rec-t b{ font-weight:800; color:var(--brand-ink); }
.rec-barra{ display:flex; align-items:center; gap:8px; margin-top:9px; }
.rec-barra > .barra{
  flex:1 1 auto; margin-top:0; height:8px;
  background:var(--surface-alt); border:1px solid var(--border);
}
.rec-barra > .barra i{ background:var(--brand-ink); }
.rec-cuenta{
  flex:none; display:inline-flex; align-items:center; gap:5px;
  font-size:11.5px; font-weight:700; color:var(--ink-soft); white-space:nowrap;
}
.rec-cuenta.hecho{ color:var(--brand-ink); }

.vpa{
  --acc:#16C15B; --acc-soft:#E5FAEC; --ink-soft:#7C88A3;
  --z:.9; zoom:var(--z);
  min-height:calc(100dvh / var(--z)); display:flex; flex-direction:column;
  background:var(--surface);
}
@media (min-width:700px){ .vpa{ --z:1; } }
.vpa .auth-top{
  width:100%; max-width:440px; margin:0 auto;

  display:flex; align-items:center; gap:10px; min-height:56px;
}
.vpa .auth-back{
  width:42px; height:42px; border-radius:14px; border:none;

}

.vpa .auth-body{

  padding:0 22px calc(26px + env(safe-area-inset-bottom));
  flex:1; display:flex; flex-direction:column;
}

  font-size:25px; font-weight:800; letter-spacing:-.4px;
  color:var(--ink); margin:0 0 10px; line-height:1.24;
}

  font-size:15px; font-weight:500; color:var(--ink-soft);
  margin:0 0 24px; line-height:1.55;
}
.vpa .auth-sub b{ color:var(--ink); word-break:break-all; }
.vpa .auth-illu{
  flex:1 1 0; min-height:0; display:flex;

.vpa .auth-illu img{
  display:block; width:100%; max-width:330px; height:100%;

.vpa .auth-actions{ margin-top:0; display:flex; flex-direction:column; gap:12px; padding-top:4px; }

.vpa .auth-foot{ text-align:center; font-size:14px; font-weight:600; color:var(--ink-soft); margin:18px 0 0; }
.vpa .auth-foot button{

.vpa .auth-legal{

.vpa .auth-legal i{ width:3px; height:3px; border-radius:50%; background:var(--ink-faint); display:inline-block; }

.vpa .auth-side{ display:none; }

/* --- Computadora: panel verde a la izquierda y el formulario a la derecha --- */
@media (min-width:900px){
  .vpa{
    --z:1;
    display:grid; grid-template-columns:1.05fr 1fr;
    grid-template-areas:'side main';
    width:100%; max-width:none; margin:0;
    height:100dvh; min-height:0; overflow:hidden;
  }
  .vpa::before{
    content:''; grid-area:side; background:var(--surface);
    border-right:1px solid var(--border);
  }
  .vpa > .auth-top, .vpa > .auth-body{ grid-area:main; }
  /* La barra de arriba va encima del formulario, pero solo el botón
     recibe los toques: si no, tapaba el formulario y no se podía regresar. */

function toast(texto, mal, pista){

  t.innerHTML =

/** Traduce los errores de Supabase a algo que cualquiera entienda. */
function errLegible(e){
  const m = String(e?.message ?? e ?? '');
  const code = e?.code ?? '';
  const status = e?.status ?? 0;
  if(/invalid login credentials/i.test(m))        return 'Correo o contraseña incorrectos';
  if(/token has expired|expired/i.test(m))        return 'Ese código ya venció: pide otro';
  if(/invalid.*(otp|token)|otp.*invalid/i.test(m))return 'Ese código no es correcto';
  if(code === 'same_password' || /should be different/i.test(m)) return 'La contraseña nueva debe ser distinta a la anterior';
  if(code === 'weak_password' || /password should|weak password/i.test(m)) return 'Esa contraseña es muy débil: usa al menos 8 caracteres';
  if(code === 'over_email_send_rate_limit' || /rate limit/i.test(m) || status === 429) return 'Se mandaron muchos correos seguidos. Espera unos minutos';
  if(/error sending|smtp|sending .*email/i.test(m)) return 'No se pudo mandar el correo. Inténtalo en un momento';
  if(/failed to fetch|networkerror|network|load failed/i.test(m)) return 'Sin conexión: revisa tu internet';
  if(status >= 500) return 'El servidor no contestó. Inténtalo otra vez';
  return m || 'Algo salió mal, inténtalo otra vez';
}

let ocupado = false;
async function conBoton(id, etiqueta, fn){
  if(ocupado) return;
  ocupado = true;
  const b = id ? $(id) : null;
  const antes = b ? b.innerHTML : '';
  if(b){ b.disabled = true; b.textContent = etiqueta; }
  try{ return await fn(); }
  catch(e){ console.error(e); toast(errLegible(e), true); }
  finally{
    ocupado = false;
    if(b && b.isConnected){ b.disabled = false; b.innerHTML = antes; }
  }
}

/* =====================================================================

   El enlace de un promotor es  .../?c=CODIGO
   ===================================================================== */
/* Nombres de carpeta que NUNCA son un código de promotor. */
const CARPETAS = ['promotores', 'promotor'];

function codigoLimpio(s){
  const c = String(s || '').trim().toUpperCase().replace(/^\/+|\/+$/g, '');
  if(!/^[A-Z0-9]{4,16}$/.test(c)) return null;
  if(CARPETAS.includes(c.toLowerCase())) return null;
  return c;
}

/**
 * Saca el código del promotor de la dirección. Se aceptan tres formas,
 * para que el enlace funcione se abra como se abra:
 *   1. /promotores/ABNER001       ← la buena, la que se comparte
 *   2. /promotores/?c=ABNER001    ← la que usa el rebote del 404
 *   3. /promotores/#ABNER001      ← respaldo, igual que el menú digital
 */
function codigoDeLaUrl(){
  const q = new URLSearchParams(location.search);
  const porQuery = codigoLimpio(q.get('c') || q.get('ref'));
  if(porQuery) return porQuery;

  const porHash = codigoLimpio((location.hash || '').replace(/^#\/?/, ''));
  if(porHash) return porHash;

  const partes = location.pathname.split('/').filter(Boolean);
  const ultima = partes[partes.length - 1] || '';
  if(/\.html?$/i.test(ultima)) return null;      // .../promotores/index.html
  if(partes.length < 2) return null;             // .../promotores  → el portal
  return codigoLimpio(ultima);
}

/** Base del portal, sin el código ni el archivo: p. ej. /promotores */
function basePortal(){
  let p = location.pathname.replace(/\/[^\/]*\.html?$/i, '/');
  const partes = p.split('/').filter(Boolean);
  const ultima = partes[partes.length - 1] || '';
  if(codigoLimpio(ultima)) partes.pop();         // quitar el código si viene en la ruta
  return '/' + partes.join('/');
}

/**
 * Deja la dirección bonita en la barra. Si el negocio llegó por el rebote
 * (/promotores/?c=ABNER001), se reescribe a /promotores/ABNER001 sin
 * recargar nada. Es solo cosmético: la atribución ya se decide en el servidor.
 */
function enderezarUrl(codigo){
  try{
    const limpia = (basePortal().replace(/\/+$/, '') || '') + '/' + codigo;
    if(location.pathname + location.search !== limpia){
      history.replaceState(null, '', limpia);
    }
  }catch(e){ /* si el navegador no deja, no pasa nada */ }
}

/* =====================================================================
   ===================  LADO DEL NEGOCIO (INVITACIÓN)  =================

   Flujo completo del enlace de un promotor:

     1. Promoción   · de quién es el enlace y el 25% del primer mes
     2. Acceso      · crear cuenta o entrar, con la MISMA autenticación
                      de VendoPlus (signInWithOtp → verifyOtp → updateUser)
     3. Bienvenida  · precio real, descuento y pago por Stripe

   La atribución se guarda en el servidor atada al correo, así que no se
   pierde al cambiar de pantalla, al entrar, al crear cuenta ni al ir a
   Stripe. El descuento lo decide la base de datos, nunca el navegador.
   ===================================================================== */

/* Sesión aparte de la del promotor: mismo proyecto y misma autenticación,
   pero con su propio almacenamiento, para que un promotor y un negocio
   puedan usar el mismo navegador sin pisarse la sesión. */
const sbNeg = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
  auth: {
    persistSession:true, autoRefreshToken:true, detectSessionInUrl:false,
    storageKey:'vp-negocio-auth'
  }
});

/* ---------------------------------------------------------------------
   Pasarle la sesión a la app principal (vendoplusoficial.com)

   Las dos páginas viven en el mismo dominio, así que comparten el
   almacenamiento del navegador. Este cliente guarda la sesión con la MISMA
   llave que usa tu app, y además deja puesto el usuario local que tu app
   revisa para saber que hay alguien dentro. Resultado: el negocio entra
   una sola vez aquí y allá ya le aparece su cuenta abierta.
   --------------------------------------------------------------------- */
const sbApp = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
  auth: { persistSession:true, autoRefreshToken:false, detectSessionInUrl:false }
});

/* Llaves que tu app considera "del aparato" y no de la cuenta: esas se
   respetan aunque se cambie de negocio (impresora, escáner, etc.). */
const APP_LLAVES_DEL_APARATO = [
  'mesa_session','mesa_user_session','mesa_active_user','mesa_printer','mesa_scanner',
  'mesa_meta','mesa_md_cfg_visible','mesa_dm_name','mesa_sync','mesa_cloud_uid','mesa_sync_pending'
];

/* Cierra la cuenta que estuviera abierta en la app y borra sus datos locales.
   Es lo mismo que hace tu app en wipeLocal() cuando entra otra cuenta en el
   mismo aparato: lo de la nube se vuelve a bajar al entrar. */
function cerrarCuentaDeLaApp(){
  try{
    const fuera = [];
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(!k) continue;
      const esDeLaCuenta = k.indexOf('mesa_') === 0 && APP_LLAVES_DEL_APARATO.indexOf(k) < 0;
      const seCierra = ['mesa_session','mesa_user_session','mesa_active_user','mesa_sync_pending'].indexOf(k) >= 0;
      if(esDeLaCuenta || seCierra) fuera.push(k);
    }
    fuera.forEach(k => { try{ localStorage.removeItem(k); }catch(e){} });
  }catch(e){}
}

async function pasarSesionAlApp(){
  try{
    const { data } = await sbNeg.auth.getSession();
    const ses = data && data.session;
    if(!ses || !ses.access_token) return false;

    const uid    = (ses.user && ses.user.id) || '';
    const correo = normCorreo((ses.user && ses.user.email) || '');

    /* ¿De quién son los datos que hay en este aparato? Tu app guarda ahí el
       dueño y, si el token es de otra cuenta, no la deja entrar. Por eso,
       cuando el negocio entra con otro correo, primero cerramos la anterior. */
    let dueno = '';
    try{ dueno = localStorage.getItem('mesa_cloud_uid') || ''; }catch(e){}
    const otraCuenta = !!dueno && !!uid && dueno !== uid;
    if(otraCuenta) cerrarCuentaDeLaApp();

    /* 1) La sesión, escrita por la propia librería para que quede en su
          formato. Si no se puede (sin señal) se guarda a mano. */
    try{
      const { error } = await sbApp.auth.setSession({
        access_token: ses.access_token,
        refresh_token: ses.refresh_token
      });
      if(error) throw error;
    }catch(e){
      const ref = (String(CONFIG.SUPABASE_URL).match(/\/\/([^.]+)\./) || [])[1];
      if(ref) localStorage.setItem('sb-' + ref + '-auth-token', JSON.stringify(ses));
    }

    /* 2) El dueño de los datos del aparato pasa a ser esta cuenta. Sin esto,
          tu app ve un token "ajeno" y lo ignora. */
    if(uid) localStorage.setItem('mesa_cloud_uid', uid);

    /* 3) El usuario local. Si ya era el mismo correo se respeta tal cual,
          para no borrarle el nombre del negocio ni sus preferencias. */
    let u = null;
    try{ u = JSON.parse(localStorage.getItem('mesa_user') || 'null'); }catch(e){}
    if(!u || normCorreo(u.email || '') !== correo){
      const ahora = new Date().toISOString();
      u = {
        name:'', country:'MX', phone:'', email:correo, photo:null, provider:'email',
        business:{ name:'', type:'', address:'', phone:'' },
        prefs:{ notifSales:true, notifStock:true, notifDaily:false, haptics:true, bizOnTicket:true },
        pin:null, createdAt:ahora, trialStart:ahora,
        membershipPaid:false, membershipPaidAt:null
      };
    }
    localStorage.setItem('mesa_user', JSON.stringify(u));
    localStorage.setItem('mesa_session', '1');
    return true;
  }catch(e){ return false; }
}

/** Deja la sesión lista y recién entonces manda al negocio a su cuenta. */
async function irAlApp(url){
  await pasarSesionAlApp();
  location.href = url || CONFIG.URL_VENDOPLUS;
}

/* ---------------------------------------------------------------------
   Llamadas al servidor
   --------------------------------------------------------------------- */
async function apiAtribuir(cuerpo){
  const r = await fetch(CONFIG.SUPABASE_URL + '/functions/v1/ref-atribuir', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', apikey:CONFIG.SUPABASE_ANON_KEY },
    body: JSON.stringify(cuerpo)
  });
  return await r.json().catch(() => ({ ok:false, mensaje:'No se pudo conectar.' }));
}

async function apiCheckout(accion){
  const { data } = await sbNeg.auth.getSession();
  const jwt = data && data.session && data.session.access_token;
  if(!jwt) return { ok:false, sinSesion:true, mensaje:'Tu sesión venció. Entra otra vez.' };
  const r = await fetch(CONFIG.SUPABASE_URL + '/functions/v1/ref-checkout', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', apikey:CONFIG.SUPABASE_ANON_KEY,
              Authorization:'Bearer ' + jwt },
    body: JSON.stringify({ accion })
  });
  return await r.json().catch(() => ({ ok:false, mensaje:'No se pudo conectar.' }));
}

/** Guardar la atribución con el correo que escribió el negocio.
    Nunca detiene el acceso: si falla, el visitante sigue su camino. */
async function guardarAtribucion(correo){
  try{
    const r = await apiAtribuir({ accion:'capturar', codigo:INV.codigo, correo });
    if(!r.ok && r.motivo === 'ya_tuvo_membresia') toast(r.mensaje, true);
    return r;
  }catch(e){ console.warn('atribucion', e); return { ok:false }; }
}

function dinero(cents, moneda){
  try{
    return new Intl.NumberFormat('es-MX', {
      style:'currency', currency: moneda || 'MXN'
    }).format((Number(cents) || 0) / 100);
  }catch(e){ return pesosC(cents); }
}
const cadaCuanto = i => (i === 'year' ? 'al año' : i === 'week' ? 'a la semana' : 'al mes');

function invHtmlReenvio(){
  return INV.reenvio > 0
    ? `Puedes pedir otro código en <b>${INV.reenvio}s</b>`
    : `¿No te llegó? <button id="bReenviarNeg">Enviar de nuevo</button>`;
}
function invTiempoReenvio(){
  clearInterval(INV.timer);
  INV.timer = setInterval(() => {
    INV.reenvio -= 1;
    const el = $('reenvioNeg');
    if(!el || INV.reenvio <= 0){
      clearInterval(INV.timer);
      if(el){ el.innerHTML = invHtmlReenvio(); invCablearReenvio(); }
      return;
    }
    el.innerHTML = invHtmlReenvio();
  }, 1000);
}
function invCablearReenvio(){
  const b = $('bReenviarNeg');
  if(b) b.onclick = () => { if(INV.pantalla === 'olvide') invOlvideEnviar(); else invAcceder(); };
}

/** Igual que ojo(), pero con el botón de texto "Ver / Ocultar". */
function verPw(idBtn, idPw){
  const b = $(idBtn); if(!b) return;
  b.onclick = () => {
    const i = $(idPw);
    const ver = i.type === 'password';
    i.type = ver ? 'text' : 'password';
    b.textContent = ver ? 'Ocultar' : 'Ver';
    i.focus();
  };
}

function pantallaInvAcceso(){
  const login = INV.pantalla === 'login';
  const c = INV.promotor || {};
  const liga = (u, txt) => u
    ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${txt}</a>`
    : `<a>${txt}</a>`;
  return `
    <div class="vpa vista">
      <div class="auth-top">
        <button class="auth-back" id="bAtras" aria-label="Regresar">${ic('izq')}</button>
      </div>
      <div class="auth-body">
        <h1 class="auth-title">${login ? 'Entra a tu cuenta' : 'Empieza a administrar tu negocio'}</h1>
        <p class="auth-sub">${login
          ? 'Escribe tu correo y tu contraseña para entrar.'
          : 'Te mandamos un código a tu correo para confirmar que es tuyo. Después eliges tu contraseña.'}</p>

        <div class="auth-illu"><img src="${login ? ILU.login : ILU.carta}" alt=""></div>

        <div class="campo">
          <label for="nCorreo">Correo electrónico</label>
          <input id="nCorreo" class="email-input" type="email" inputmode="email"
                 autocomplete="${login ? 'username' : 'email'}" autocapitalize="none"
                 autocorrect="off" spellcheck="false" maxlength="120"
                 placeholder="tucorreo@gmail.com" value="${esc(INV.correo)}">

          ${vpaCampoPw('nPw', 'nOjo', 'current-password', 'Contraseña')}
          <p class="auth-foot" style="margin:0 0 14px; text-align:right;">
            <button id="bOlvideNeg">¿Olvidaste tu contraseña?</button>

            <span class="terms-text">Aceptas los ${liga(c.url_terminos, 'términos y condiciones')}

}

/* Arreglo del teclado: en celular, al cerrar el teclado (botón "Listo",
   tocar fuera o mandar el formulario) la página se quedaba desplazada hacia
   arriba con un hueco gris abajo. Esto la regresa a su lugar. */
(function(){
  function regresar(){
    const d = document.scrollingElement || document.documentElement;
    if(d.scrollHeight - window.innerHeight <= 140){
      try{ window.scrollTo(0, 0); }catch(e){}
      d.scrollTop = 0;
      document.body.scrollTop = 0;
    }
    const app = document.getElementById('app');
    if(app && app.scrollHeight - app.clientHeight <= 140) app.scrollTop = 0;
    const cuerpo = app && app.querySelector && app.querySelector('.auth-body, .mem-in, .body');
    if(cuerpo && cuerpo.scrollHeight - cuerpo.clientHeight <= 140) cuerpo.scrollTop = 0;
  }
  function siNadieEscribe(){
    setTimeout(() => {
      const a = document.activeElement;
      if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
      regresar();
      setTimeout(regresar, 220);
    }, 70);
  }
  addEventListener('focusout', siNadieEscribe, true);
  if(window.visualViewport){
    let alto = visualViewport.height;
    visualViewport.addEventListener('resize', () => {
      const nuevo = visualViewport.height;
      if(nuevo > alto + 80) siNadieEscribe();   // se cerró el teclado
      alto = nuevo;
    });
  }
  // Con "Listo"/Enter se cierra el teclado en vez de dejarlo abierto.
  addEventListener('keydown', ev => {
    if(ev.key === 'Enter'){
      const a = document.activeElement;
      if(a && a.tagName === 'INPUT') setTimeout(() => { try{ a.blur(); }catch(e){} }, 0);
    }
  }, true);
})();

/* Arreglo del deslizamiento: al cambiar de pantalla siempre arranca
   hasta arriba (antes se quedaba donde estaba la pantalla anterior)
   y la nueva entra subiendo, como en la app. */
function entrada(clave){
  const app = $('app');
  if(!app || entrada._ult === clave) return;
  entrada._ult = clave;
  const arriba = () => {
    try{ window.scrollTo(0, 0); }catch(e){}
    if(document.scrollingElement) document.scrollingElement.scrollTop = 0;
    document.body.scrollTop = 0;
    app.scrollTop = 0;
    if(app.querySelectorAll){
      app.querySelectorAll('.auth-body, .mem-in, .body, .vista')
         .forEach(n => { n.scrollTop = 0; });
    }
  };
  arriba();
  requestAnimationFrame(arriba);
  app.classList.remove('entra');
  void app.offsetWidth;
  app.classList.add('entra');
  clearTimeout(entrada._t);
  entrada._t = setTimeout(() => app.classList.remove('entra'), 700);
}

    c.onkeydown = ev => { if(ev.key === 'Enter'){ ev.preventDefault(); invAcceder(); } };
    $('nBtn').onclick = invAcceder;
    $('bAtras').onclick = () => irInv('promo');
    $('bCambiaNeg').onclick = () => { INV.pw = ''; irInv(p === 'login' ? 'signup' : 'login'); };

      verPw('nOjo', 'nPw');
    }
    enfocar(c, 160);
  }

  if(p === 'codigo'){
    $('bAtras').onclick = async () => {
      await sbNeg.auth.signOut().catch(() => {});
      clearInterval(INV.timer); irInv('signup');
    };

    cablearOtp(invVerificarCodigo);

  if(p === 'olvide'){
    $('bAtras').onclick = () => {
      clearInterval(INV.timer);
      if(INV.fpaso === 2){ INV.fpaso = 1; pintarInv(); } else irInv('login');
    };
    if(INV.fpaso === 2){
      verPw('nfOjo', 'nfPw');
      $('nfBtn').onclick = invOlvideConfirmar;
      $('nfPw').onkeydown = ev => { if(ev.key === 'Enter'){ ev.preventDefault(); invOlvideConfirmar(); } };
      invCablearReenvio();
      enfocar($('nfCod'), 160);
    }else{
      const c = $('nfCorreo');
      c.oninput = () => { INV.correo = c.value.trim(); };
      c.onkeydown = ev => { if(ev.key === 'Enter'){ ev.preventDefault(); invOlvideEnviar(); } };
      $('nfBtn').onclick = invOlvideEnviar;

  }

    $('bDescarga').onclick = ev => {
      ev.preventDefault();
      toast('Falta poner el enlace de descarga en URL_DESCARGA');

function invAcceder(){
  const correo = normCorreo(INV.correo);
  if(!esCorreo(correo)) return toast('Revisa tu correo: debe verse así nombre@gmail.com', true);

  const login = INV.pantalla === 'login';
  const reenvio = INV.pantalla === 'codigo';
  if(reenvio && INV.reenvio > 0) return;
  if(INV.pantalla === 'signup' && !INV.terminos)
    return toast('Acepta los términos para continuar', true);
  vibra(12);

  return conBoton(reenvio ? null : 'nBtn', login ? 'Entrando…' : 'Enviando…', async () => {
    // La atribución se guarda ANTES de entrar: así queda del lado del
    // servidor aunque el visitante abandone a medio camino.
    await guardarAtribucion(correo);

    if(login){
      if((INV.pw || '').length < 1) return toast('Escribe tu contraseña', true);
      const { error } = await sbNeg.auth.signInWithPassword({ email:correo, password:INV.pw });
      if(error) return toast(errLegible(error), true);
      INV.pw = '';
      return await invDespuesDeEntrar();
    }

    const { error } = await sbNeg.auth.signInWithOtp({ email:correo, options:{ shouldCreateUser:true } });
    if(error) return toast(errLegible(error), true);
    INV.reenvio = 60;
    if(reenvio){
      const el = $('reenvioNeg'); if(el){ el.innerHTML = invHtmlReenvio(); invCablearReenvio(); }
      toast('Te mandamos otro código');
    }else irInv('codigo');
    invTiempoReenvio();
  });
}

function invVerificarCodigo(){
  const token = valorOtp();
  if(token.length !== CONFIG.CODIGO_DIGITOS) return;
  const correo = normCorreo(INV.correo);

  return conBoton('oBtn', 'Verificando…', async () => {
    const { data, error } = await sbNeg.auth.verifyOtp({ email:correo, token, type:'email' });
    if(error) return fallaOtp(errLegible(error));
    clearInterval(INV.timer); vibra(20);
    INV.pw = '';

    /* Si esa cuenta ya existía, no hay nada que crear: se manda a entrar. */
    if(cuentaYaExistia(data && data.user)){
      await sbNeg.auth.signOut().catch(() => {});
      irInv('login');
      return toast('Esa cuenta ya está registrada. Entra con tu contraseña.', true);
    }
    irInv('clave');
  });
}

/** ¿La cuenta ya existía antes de pedir este código?
    Se sabe por dos señales: ya eligió contraseña alguna vez, o se creó
    hace rato (no en estos minutos, que es cuando nace una cuenta nueva). */
function cuentaYaExistia(u){
  if(!u) return false;
  const meta = u.user_metadata || {};
  if(meta.vendo_pw) return true;
  const creada = Date.parse(u.created_at || '');
  if(!creada) return false;
  return (Date.now() - creada) > 10 * 60 * 1000;
}

function invGuardarClave(){
  const pw = INV.pw || '';
  if(pw.length < 8) return toast('La contraseña debe tener mínimo 8 caracteres', true);

  return conBoton('nBtn2', 'Creando…', async () => {
    const { error } = await sbNeg.auth.updateUser({ password:pw, data:{ vendo_pw:true } });
    if(error) return toast(errLegible(error), true);
    INV.pw = '';
    vibra([15, 60, 15]);
    await invDespuesDeEntrar();
  });
}

function invOlvideEnviar(){

  const reenvio = INV.fpaso === 2;

function invOlvideConfirmar(){
  const correo = normCorreo(INV.correo);
  const token = (($('nfCod') || {}).value || '').replace(/\D/g, '');
  const pw = ($('nfPw') || {}).value || '';
  if(!INV.fverificado && token.length !== CONFIG.CODIGO_DIGITOS)
    return toast('Escribe el código de ' + CONFIG.CODIGO_DIGITOS + ' dígitos', true);
  if(pw.length < 8) return toast('La contraseña debe tener mínimo 8 caracteres', true);

  return conBoton('nfBtn', 'Cambiando…', async () => {
    if(!INV.fverificado){
      const v = await sbNeg.auth.verifyOtp({ email:correo, token, type:'email' });
      if(v.error) return toast(errLegible(v.error), true);
      INV.fverificado = true;
    }
    const u = await sbNeg.auth.updateUser({ password:pw });
    if(u.error) return toast(errLegible(u.error), true);
    clearInterval(INV.timer);
    INV.fverificado = false; INV.fpaso = 1;
    await invDespuesDeEntrar();
    toast('Contraseña actualizada');
  });
}

/** Ya hay sesión: se pide al servidor el precio real y la elegibilidad. */
async function invDespuesDeEntrar(){
  irInv('bienvenido');
  const o = await apiCheckout('estado');

  if(!o.ok){
    // La sesión guardada puede haber vencido. En ese caso se limpia y se
    // regresa a la promoción: nunca se deja la pantalla girando sin salida.
    if(o.sinSesion){
      await sbNeg.auth.signOut().catch(() => {});
      INV.oferta = null; INV.pw = '';
      irInv('promo');
      return toast('Tu sesión venció. Entra otra vez.', true);
    }
    INV.oferta = null;
    irInv('promo');
    return toast(o.mensaje || 'No se pudo cargar tu promoción. Inténtalo otra vez.', true);
  }

  INV.oferta = o;
  pasarSesionAlApp();   // para que su cuenta ya esté abierta del otro lado
  pintarInv();
}

function invPagar(){
  return conBoton('bPagar', 'Abriendo pago…', async () => {
    const r = await apiCheckout('crear');
    if(r.sinSesion){
      await sbNeg.auth.signOut().catch(() => {});
      INV.oferta = null; irInv('promo');
      return toast('Tu sesión venció. Entra otra vez.', true);
    }
    if(!r.ok || !r.url) return toast(r.mensaje || 'No se pudo abrir el pago.', true);
    if(!r.con_descuento && r.mensaje) toast(r.mensaje, true);
    location.href = r.url;     // a Stripe Checkout
  });
}

/* =====================================================================
   ARRANQUE DE LA INVITACIÓN
   ===================================================================== */
async function arrancarInvitacion(codigo){
  INV.codigo = codigo;

  /* PRIMERO se lee la dirección y DESPUÉS se endereza. Al revés no sirve:
     enderezarUrl() reescribe la dirección sin el "?pago=ok" que manda
     Stripe al volver, así que leerlo después siempre daba null y nunca se
     mostraba la pantalla de "ya pagaste" que lo pasa a la app. */
  const q = new URLSearchParams(location.search);
  INV.pago = q.get('pago');

  enderezarUrl(codigo);

  const r = await apiAtribuir({ accion:'ver', codigo });
  INV.promotor = r && r.ok ? r : null;
  if(!INV.promotor) return pintarInv();

  const { data } = await sbNeg.auth.getSession();
  if(data && data.session){
    if(INV.pago === 'ok'){
      irInv('pagado');
      apiCheckout('estado').then(o => { if(o.ok){ INV.oferta = o; if(INV.pantalla === 'pagado') pintarInv(); } });
      return;
    }
    if(INV.pago === 'cancel') toast('No se completó el pago. Puedes intentarlo otra vez.', true);
    return await invDespuesDeEntrar();
  }

  /* Volvió de Stripe pero el navegador perdió la sesión (pasa en los
     navegadores de dentro de otras apps). Su pago está bien; solo hay que
     decirle que entre con su correo, no dejarlo en la promoción a secas. */
  if(INV.pago === 'ok'){
    toast('Tu pago se recibió. Entra con tu correo para abrir tu cuenta.',
          false, 'Es el mismo correo con el que pagaste');
  }

  irInv('promo');
}

/* ---------- Pantalla: código de 6 dígitos ---------- */
function pantallaCodigo(){
  const n = CONFIG.CODIGO_DIGITOS;
  let celdas = '';
  for(let i = 0; i < n; i++){
    celdas += `<input class="otp-cell" id="c${i}" type="tel" inputmode="numeric" maxlength="1"
                 autocomplete="${i === 0 ? 'one-time-code' : 'off'}" aria-label="Dígito ${i + 1}">`;
  }
  return `
    <div class="acceso-in vista">
      <div class="top" style="background:none; border:none; padding:0 0 6px; position:static;">
        <button class="icon-btn back" id="bAtras" aria-label="Regresar">${ic('izq')}</button>
      </div>
      <div class="acceso-ilu">${ic('carta')}</div>
      <h1 class="tit">Escribe tu código</h1>
      <p class="sub">Te lo mandamos a
         <b style="color:var(--ink); word-break:break-all;">${esc(S.correo)}</b>.</p>
      <p class="aviso-correo">¿No lo ves? Busca en <b>Spam</b> o en <b>Promociones</b>.</p>
      <div class="otp-row" id="otpRow">${celdas}</div>
      <button class="btn primary xl block" id="oBtn" disabled>Verificar</button>
      <p class="otp-help" id="reenvio" style="margin-top:14px;">${htmlReenvio()}</p>
    </div>`;
}

/* ---------- Pantalla: elegir contraseña ---------- */
function pantallaClave(){
  return `
    <div class="acceso-in vista">
      <div class="acceso-ilu">${ic('llave')}</div>
      <h1 class="tit">Elige tu contraseña</h1>
      <p class="sub">Tu correo <b style="color:var(--ink); word-break:break-all;">${esc(S.correo)}</b>
         ya quedó confirmado. Con esta contraseña vas a entrar la próxima vez.</p>
      <div class="field">
        <label for="pPw">Contraseña <span style="font-weight:600;">(mínimo 8 caracteres)</span></label>
        <div class="pw-caja">
          <input id="pPw" class="entrada" type="password" autocomplete="new-password"
                 style="padding-right:50px;" placeholder="••••••••">
          <button class="pw-ojo" id="pOjo" type="button" aria-label="Ver contraseña">${ic('ojo')}</button>
        </div>
      </div>
      <button class="btn primary xl block" id="pBtn" disabled>Guardar y continuar</button>
    </div>`;
}

/* ---------- Pantalla: recuperar contraseña ---------- */
function pantallaOlvide(){
  const paso2 = S.fpaso === 2;
  return `
    <div class="acceso-in vista">
      <div class="top" style="background:none; border:none; padding:0 0 6px; position:static;">
        <button class="icon-btn back" id="bAtras" aria-label="Regresar">${ic('izq')}</button>
      </div>
      <div class="acceso-ilu">${paso2 ? ic('llave') : ic('carta')}</div>
      <h1 class="tit">Recupera tu contraseña</h1>
      <p class="sub">${paso2
        ? 'Escribe el código que mandamos a tu correo y elige tu contraseña nueva.'
        : 'Te mandamos un código a tu correo para que elijas una contraseña nueva.'}</p>
      ${paso2 ? `
        <p class="aviso-correo">¿No lo ves? Busca en <b>Spam</b> o en <b>Promociones</b>.</p>
        <div class="field">
          <label for="fCod">Código de ${CONFIG.CODIGO_DIGITOS} dígitos</label>
          <input id="fCod" class="entrada" type="tel" inputmode="numeric" autocomplete="one-time-code"
                 maxlength="${CONFIG.CODIGO_DIGITOS}" placeholder="${'0'.repeat(CONFIG.CODIGO_DIGITOS)}"
                 style="letter-spacing:6px; text-align:center;">
        </div>
        <div class="field">
          <label for="fPw">Contraseña nueva <span style="font-weight:600;">(mínimo 8 caracteres)</span></label>
          <div class="pw-caja">
            <input id="fPw" class="entrada" type="password" autocomplete="new-password"
                   style="padding-right:50px;" placeholder="••••••••">
            <button class="pw-ojo" id="fOjo" type="button" aria-label="Ver contraseña">${ic('ojo')}</button>
          </div>
        </div>
        <button class="btn primary xl block" id="fBtn">Cambiar contraseña</button>
        <p class="otp-help" id="reenvio" style="margin-top:14px;">${htmlReenvio()}</p>
      ` : `
        <div class="field">
          <label for="fCorreo">Correo electrónico</label>
          <input id="fCorreo" class="entrada" type="email" inputmode="email" autocomplete="email"
                 autocapitalize="none" spellcheck="false" maxlength="120"
                 placeholder="tucorreo@gmail.com" value="${esc(S.correo)}">
        </div>
        <button class="btn primary xl block" id="fBtn">${ic('correo')} Enviar código a mi correo</button>
      `}
    </div>`;
}

/* ---------- Pantalla: ¿cómo te llamas? (primera vez) ---------- */
function pantallaNombre(){
  return `
    <div class="acceso-in vista">
      <div class="acceso-ilu">${ic('semilla')}</div>
      <h1 class="tit">¿Cómo te llamas?</h1>
      <p class="sub">Así te van a ver los negocios que abran tu enlace de invitación.</p>
      <div class="field">
        <label for="nNom">Tu nombre</label>
        <input id="nNom" class="entrada" type="text" autocomplete="name" maxlength="60"
               placeholder="Ana Martínez">
      </div>
      <button class="btn primary xl block" id="nBtn">Crear mi enlace</button>
    </div>`;
}

/* =====================================================================
   PANTALLA PRINCIPAL
   Solo dos secciones: bonos acumulados y comisiones ganadas.
   ===================================================================== */
function pantallaInicio(){
  const p = S.promotor || {};
  const sa = p.saldos || {};
  const b = sa.bonos || {};
  const c = sa.comisiones || {};
  const nombre = (p.nombre || '').split(' ')[0] || 'Hola';

  return `
    <div class="top pri">
      <span class="pri-logo">${ic('rayo')}</span>
      <div class="pri-marca">
        <b>VendoPlus</b>
        <span>Promotores</span>

/* =====================================================================
   BANNER DE RECOMPENSAS EXTRA

   Una escalera de metas, en este orden y sin repetirse:
     1º  6 negocios → $250     2º  4 negocios más → $180     3º  2 más → $100

   Los niveles, los premios y el avance los calcula el servidor en
   ref_saldos: aquí solo se dibuja lo que llega. Un nivel puede estar
   bloqueado (falta el anterior), activo (es el que toca) o logrado.
   El nivel que se está viendo se guarda en S.recNivel.
   ===================================================================== */
function bannerExtras(sa, hacia){
  const niveles = ((sa || {}).extras || {}).niveles || [];
  if(!niveles.length) return '';

  const total = niveles.length;
  const i     = Math.max(0, Math.min(S.recNivel | 0, total - 1));
  const n     = niveles[i];
  const antes = i > 0 ? niveles[i - 1] : null;
  const premio = pesosC(n.premio_cents);

  /* Los tres estados llevan la MISMA estructura —título de dos renglones,
     barra y contador— para que la tarjeta mida exactamente igual en todos
     y no empuje el resto de la pantalla al cambiar de recompensa. */
  let cuerpo;
  if(!n.abierto){
    /* Todavía no le toca: primero tiene que cerrar el nivel anterior. */
    cuerpo = `
      <p class="rec-t">Desbloquea los ${antes ? antes.negocios : n.negocios} negocios para la siguiente recompensa.</p>
      <div class="rec-barra">
        <span class="barra"><i style="width:0%"></i></span>
        <span class="rec-cuenta">${ic('candado')}${n.negocios} · ${premio}</span>
      </div>`;
  }else if(n.logrado){
    cuerpo = `
      <p class="rec-t">¡Listo! Ganaste <b>${premio} MXN</b> extras por ${n.negocios} negocios.</p>
      <div class="rec-barra">
        <span class="barra"><i style="width:100%"></i></span>
        <span class="rec-cuenta hecho">${ic('check')}Logrado</span>
      </div>`;
  }else{
    const pct = Math.round((n.avance / Math.max(n.negocios, 1)) * 100);
    cuerpo = `
      <p class="rec-t">Consigue ${n.negocios} negocios y obtén <b>${premio} MXN</b> extras.</p>
      <div class="rec-barra">
        <span class="barra"><i style="width:${pct}%"></i></span>
        <span class="rec-cuenta">${n.avance} de ${n.negocios} este mes</span>
      </div>`;
  }

  const clases = ['rec'];
  if(!n.abierto) clases.push('bloq');
  if(i > 0)      clases.push('con-ant');
  /* Solo se anima si el cambio lo pidió el usuario con una flecha. */
  if(hacia === 'izq') clases.push('hacia-izq');
  if(hacia === 'der') clases.push('hacia-der');

  /* El primero solo lleva ›, el de en medio ‹ y ›, el último solo ‹. */
  return `
    <div class="${clases.join(' ')}" id="recBanner">
      ${i > 0 ? `<button class="rec-nav ant" id="bRecAnt" aria-label="Recompensa anterior">${ic('izq')}</button>` : ''}
      <div class="rec-cuerpo">
        <div class="rec-tx">${cuerpo}</div>
        <span class="rec-art" aria-hidden="true"></span>
      </div>
      ${i < total - 1 ? `<button class="rec-nav sig" id="bRecSig" aria-label="Siguiente recompensa">${ic('der')}</button>` : ''}
    </div>`;
}

function cablearBanner(){
  const ant = $('bRecAnt'), sig = $('bRecSig');
  if(ant) ant.onclick = () => moverBanner(-1);
  if(sig) sig.onclick = () => moverBanner(1);
}

/* Cambiar de recompensa repinta SOLO el banner, no toda la pantalla: así
   no brinca el scroll y la animación se siente fluida. */
function moverBanner(paso){
  const niveles = (((S.promotor || {}).saldos || {}).extras || {}).niveles || [];
  if(!niveles.length) return;
  const destino = Math.max(0, Math.min((S.recNivel | 0) + paso, niveles.length - 1));
  if(destino === (S.recNivel | 0)) return;
  S.recNivel = destino;

  const viejo = $('recBanner');
  if(!viejo) return pintar();
  viejo.outerHTML = bannerExtras((S.promotor || {}).saldos, paso < 0 ? 'izq' : 'der');
  cablearBanner();
  vibra(8);
}

/** Agrupa movimientos por mes, del más reciente al más viejo.
    El mes se calcula en hora del centro de México, igual que las fechas. */
function agruparPorMes(filas){
  const fmtMes = new Intl.DateTimeFormat('es-MX', { month:'long', timeZone:'America/Mexico_City' });
  const fmtAno = new Intl.DateTimeFormat('es-MX', { year:'numeric', timeZone:'America/Mexico_City' });
  const anoHoy = fmtAno.format(new Date());
  const mapa = new Map();
  (filas || []).slice()
    .sort((a, b) => new Date(b.pagado_en || 0) - new Date(a.pagado_en || 0))
    .forEach(f => {
      const t = new Date(f.pagado_en || 0);
      const ano = fmtAno.format(t);
      const clave = ano + '-' + fmtMes.format(t);
      let mes = mapa.get(clave);
      if(!mes){
        const nom = fmtMes.format(t);
        mes = {
          clave,
          etiqueta: nom.charAt(0).toUpperCase() + nom.slice(1) + (ano === anoHoy ? '' : ' ' + ano),
          filas: []
        };
        mapa.set(clave, mes);
      }
      mes.filas.push(f);
    });
  return [...mapa.values()];
}

/* =====================================================================

   ===================================================================== */
function pintar(){
  const app = $('app');
  const p = S.pantalla;

  if(p === 'cargando'){
    app.className = 'cargando';
    app.innerHTML = '<div class="spin"></div>';
    return;
  }

  if(['acceso','codigo','clave','olvide','nombre'].includes(p)){
    /* La pantalla de entrar trae su propio acomodo de pantalla completa. */
    app.className = p === 'acceso' ? 'acceso ini-pag' : 'acceso';
    app.innerHTML = p === 'acceso' ? pantallaAcceso()
                  : p === 'codigo' ? pantallaCodigo()
                  : p === 'clave'  ? pantallaClave()
                  : p === 'olvide' ? pantallaOlvide()
                  : pantallaNombre();
    entrada('app:' + p);
    cablearAcceso();
    return;
  }

  app.className = 'wrap' + (p === 'inicio' ? ' pri-pag' : p === 'comisiones' ? ' com-pag' : '');
  app.innerHTML = p === 'inicio'     ? pantallaInicio()
                : p === 'bonos'      ? pantallaBonos()
                : p === 'comisiones' ? pantallaComisiones()
                : p === 'inactivos'  ? pantallaInactivos()
                : p === 'cobro'      ? pantallaCobro()
                : pantallaAyuda();
  entrada('app:' + p);
  cablearPortal();
}

/* ---------- Eventos de las pantallas de acceso ---------- */
function cablearAcceso(){
  const p = S.pantalla;

  if(p === 'acceso'){
    const cor = $('aCorreo');
    cor.oninput = () => { S.correo = cor.value.trim(); };
    cor.onkeydown = ev => { if(ev.key === 'Enter'){ ev.preventDefault(); accionAcceso(); } };

    if($('bOlvide')) $('bOlvide').onclick = () => { S.fpaso = 1; S.fverificado = false; irA('olvide'); };
    $('aPw').oninput = e => { S.pw = e.target.value; };
    $('aPw').onkeydown = ev => { if(ev.key === 'Enter'){ ev.preventDefault(); accionAcceso(); } };

  }

  if(p === 'codigo'){
    $('bAtras').onclick = async () => { await sb.auth.signOut().catch(() => {}); clearInterval(S.timer); irA('acceso'); };
    cablearOtp();

    cablearReenvio();
  }

  if(p === 'clave'){
    const pw = $('pPw');
    pw.oninput = () => { S.pw = pw.value; $('pBtn').disabled = pw.value.length < 8; };
    pw.onkeydown = ev => { if(ev.key === 'Enter' && pw.value.length >= 8){ ev.preventDefault(); guardarClave(); } };
    ojo('pOjo', 'pPw');
    $('pBtn').onclick = guardarClave;

  }

  if(p === 'olvide'){
    $('bAtras').onclick = () => {
      clearInterval(S.timer);

    };
    if(S.fpaso === 2){
      ojo('fOjo', 'fPw');
      $('fBtn').onclick = confirmarOlvide;
      $('fPw').onkeydown = ev => { if(ev.key === 'Enter'){ ev.preventDefault(); confirmarOlvide(); } };

function ojo(idBtn, idPw){
  const b = $(idBtn); if(!b) return;
  b.onclick = () => {
    const i = $(idPw);

    i.type = ver ? 'text' : 'password';
    b.innerHTML = ver ? ic('ojoNo') : ic('ojo');
    i.focus();
  };
}

function cablearReenvio(){
  const area = $('reenvio'); if(!area) return;
  const b = $('bReenviar');
  if(b) b.onclick = () => { if(S.pantalla === 'olvide') enviarOlvide(); else accionAcceso(); };
}

/* ---------- Celdas del código ---------- */
function cablearOtp(alCompletar){
  const n = CONFIG.CODIGO_DIGITOS;
  const celdas = [];
  for(let i = 0; i < n; i++) celdas.push($('c' + i));

  const revisar = () => {
    const v = celdas.map(c => c.value).join('');
    $('oBtn').disabled = v.length !== n;
    celdas.forEach(c => c.classList.toggle('filled', !!c.value));
    if(v.length === n) (alCompletar || verificarCodigo)();
  };

  celdas.forEach((c, i) => {
    c.oninput = () => {
      c.value = c.value.replace(/\D/g, '').slice(0, 1);
      if(c.value && i < n - 1) celdas[i + 1].focus();
      revisar();
    };
    c.onkeydown = ev => {
      if(ev.key === 'Backspace' && !c.value && i > 0){ celdas[i - 1].focus(); celdas[i - 1].value = ''; revisar(); }
    };
    c.onpaste = ev => {
      ev.preventDefault();
      const t = (ev.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, n);
      for(let k = 0; k < n; k++) celdas[k].value = t[k] || '';
      celdas[Math.min(t.length, n - 1)].focus();
      revisar();
    };
  });
  enfocar(celdas[0], 180);
}
const valorOtp = () => {
  let v = '';
  for(let i = 0; i < CONFIG.CODIGO_DIGITOS; i++) v += ($('c' + i) || {}).value || '';
  return v;
};
function fallaOtp(msg){
  const r = $('otpRow');
  if(r){ r.classList.add('error'); setTimeout(() => r.classList.remove('error'), 400); }
  for(let i = 0; i < CONFIG.CODIGO_DIGITOS; i++){ const c = $('c' + i); if(c){ c.value = ''; c.classList.remove('filled'); } }
  const p = $('c0'); if(p) p.focus();
  $('oBtn').disabled = true;
  vibra([18, 60, 18]);
  toast(msg, true);
}

/* ---------- Acciones de acceso ---------- */
function accionAcceso(){
  const correo = normCorreo(S.correo);
  if(!esCorreo(correo)) return toast('Revisa tu correo: debe verse así nombre@gmail.com', true);
  if((S.pw || '').length < 1) return toast('Escribe tu contraseña', true);
  vibra(12);

  // Los promotores no se registran aquí: su cuenta ya existe en VendoPlus.
  return conBoton('aBtn', 'Entrando…', async () => {
    const { error } = await sb.auth.signInWithPassword({ email:correo, password:S.pw });
    if(error) return toast(errLegible(error), true);
    S.pw = '';
    await despuesDeEntrar();
  });
}

function verificarCodigo(){
  const token = valorOtp();
  if(token.length !== CONFIG.CODIGO_DIGITOS) return;
  const correo = normCorreo(S.correo);

  return conBoton('oBtn', 'Verificando…', async () => {
    const { error } = await revisarCodigo(correo, token);
    if(error) return fallaOtp(errLegible(error));
    clearInterval(S.timer);
    vibra(20);

    // ¿Ya era promotor? Entonces entra directo.
    const t = await sb.rpc('ref_mi_tablero');
    if(t.data && t.data.ok){
      S.promotor = t.data;
      return await abrirPortal();
    }
    S.pw = '';
    irA('clave');
  });
}

function guardarClave(){
  const pw = S.pw || '';
  if(pw.length < 8) return toast('La contraseña debe tener mínimo 8 caracteres', true);

  return conBoton('pBtn', 'Guardando…', async () => {
    const { error } = await sb.auth.updateUser({ password:pw, data:{ vp_promotor:true } });
    if(error) return toast(errLegible(error), true);
    S.pw = '';
    irA('nombre');
  });
}

function crearPromotor(){
  const nombre = ($('nNom').value || '').trim();
  if(nombre.length < 2) return toast('Escribe tu nombre', true);

  return conBoton('nBtn', 'Creando…', async () => {
    const r = await sb.rpc('ref_alta_promotor', { p_nombre: nombre });
    if(r.error) return toast(errLegible(r.error), true);
    if(!r.data || !r.data.ok) return toast(r.data?.mensaje || 'No se pudo crear tu cuenta de promotor.', true);
    vibra([15, 60, 15]);
    await abrirPortal();
    toast('Listo, tu enlace ya está activo');
  });
}

function enviarOlvide(){
  const correo = normCorreo(S.correo);
  if(!esCorreo(correo)) return toast('Revisa tu correo: debe verse así nombre@gmail.com', true);
  const reenvio = S.fpaso === 2;
  if(reenvio && S.reenvio > 0) return;

  return conBoton(reenvio ? null : 'fBtn', 'Enviando…', async () => {
    const { error } = await mandarCodigo(correo, false);
    if(error) return toast(errLegible(error), true);
    S.reenvio = 60; S.fverificado = false;
    if(reenvio){ const el = $('reenvio'); if(el){ el.innerHTML = htmlReenvio(); cablearReenvio(); } }
    else{ S.fpaso = 2; pintar(); }
    tiempoReenvio();
    toast('Te mandamos un código a tu correo');
  });
}

function confirmarOlvide(){
  const correo = normCorreo(S.correo);
  const token = (($('fCod') || {}).value || '').replace(/\D/g, '');
  const pw = ($('fPw') || {}).value || '';
  if(!S.fverificado && token.length !== CONFIG.CODIGO_DIGITOS)
    return toast('Escribe el código de ' + CONFIG.CODIGO_DIGITOS + ' dígitos', true);
  if(pw.length < 8) return toast('La contraseña debe tener mínimo 8 caracteres', true);

  return conBoton('fBtn', 'Cambiando…', async () => {
    if(!S.fverificado){
      const v = await revisarCodigo(correo, token);
      if(v.error) return toast(errLegible(v.error), true);
      S.fverificado = true;   // el código ya se usó: si falla la contraseña no se pide otra vez
    }
    const u = await sb.auth.updateUser({ password:pw });
    if(u.error) return toast(errLegible(u.error), true);
    clearInterval(S.timer);
    S.fverificado = false; S.fpaso = 1;
    await despuesDeEntrar();
    toast('Contraseña actualizada');
  });
}

/* ---------- Después de entrar ---------- */
async function despuesDeEntrar(){
  const t = await sb.rpc('ref_mi_tablero');
  if(t.error){ toast(errLegible(t.error), true); return irA('acceso'); }
  if(t.data && t.data.ok){
    S.promotor = t.data;
    return await abrirPortal();
  }
  // Tiene sesión pero todavía no es promotor: le pedimos su nombre.
  irA('nombre');
}

async function abrirPortal(){
  irA('inicio');
  escuchar();
  refrescar();
}

/* ---------- Eventos del portal ---------- */
function cablearPortal(){
  const p = S.pantalla;

  if(p === 'inicio'){
    $('bCopiar').onclick = copiarEnlace;
    $('bBonos').onclick  = async () => { irA('bonos');      await cargarBonos(); };
    $('bComis').onclick  = async () => { irA('comisiones'); await cargarComisiones(); };
    $('bAyuda').onclick  = () => irA('ayuda');
    $('bSalir').onclick  = cerrarSesion;
    if($('bCobro')) $('bCobro').onclick = () => irA('cobro');
    cablearBanner();
  }

  if(p === 'cobro'){
    if($('bCambiarCobro')) $('bCambiarCobro').onclick = () => { S.editandoCobro = true; pintar(); };
    if($('bCancelarCobro')) $('bCancelarCobro').onclick = () => { S.editandoCobro = false; pintar(); };
    /* Lo de abajo solo existe mientras edita. Ojo: nada de `return` aquí,
       porque más abajo se cablea el botón de regresar de esta pantalla. */
    const cl = $('cClabe');
    if(cl){
      const pista = $('cClabePista');
      const revisar = () => {
        const d = cl.value.replace(/\D/g, '');
        if(!d.length){ pista.textContent = ''; pista.className = 'cob-pista'; return; }
        if(d.length < 18){
          pista.textContent = 'Llevas ' + d.length + ' de 18 dígitos';
          pista.className = 'cob-pista';
        }else if(clabeOk(d)){
          pista.textContent = 'CLABE correcta';
          pista.className = 'cob-pista bien';
        }else{
          pista.textContent = 'Esa CLABE no es válida: revisa los dígitos';
          pista.className = 'cob-pista mal';
        }
      };
      cl.oninput = revisar;
      revisar();
      $('bGuardarCobro').onclick = guardarCobro;
    }
  }

  if(['bonos','comisiones','inactivos','ayuda','cobro'].includes(p)){
    const atras = $('bAtras');
    if(atras) atras.onclick = () => { S.editandoCobro = false; irA(p === 'inactivos' ? 'bonos' : 'inicio'); };
  }

  if(p === 'bonos'){
    if($('bInactivos')) $('bInactivos').onclick = async () => { irA('inactivos'); await cargarInactivos(); };
    if($('bReclamarBonos')) $('bReclamarBonos').onclick = () => reclamar('bonos', 'bReclamarBonos');
  }

  if(p === 'comisiones' && $('bReclamarComis')){
    $('bReclamarComis').onclick = () => reclamar('comisiones', 'bReclamarComis');
  }
}

async function copiarEnlace(){
  const enlace = (S.promotor || {}).enlace || '';
  if(!enlace) return;
  const b = $('bCopiar');
  try{
    await navigator.clipboard.writeText(enlace);
  }catch(e){
    const t = document.createElement('textarea');
    t.value = enlace; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    try{ document.execCommand('copy'); }catch(e2){}
    document.body.removeChild(t);
  }
  vibra(15);
  b.classList.add('ok');
  b.innerHTML = ic('check') + ' Copiado';
  setTimeout(() => { if(b.isConnected){ b.classList.remove('ok'); b.innerHTML = ic('copiar') + ' Copiar'; } }, 1800);
}

/** Pedir el dinero de una sección. El servidor decide el importe. */
async function cargarCobro(){
  const r = await sb.rpc('ref_mi_cobro');
  if(r.error || !r.data || !r.data.ok) return;
  S.cobro = r.data;
  /* Repintar al llegar: el inicio ya se dibujó con el tablero, antes que
     estos datos, y si no se repinta se queda con "Faltan tus datos".
     En la pantalla de cobro solo se repinta si no está editando, para no
     borrarle lo que está escribiendo. */
  const editando = S.editandoCobro || !r.data.completo;
  if(S.pantalla === 'inicio' || (S.pantalla === 'cobro' && !editando)) pintar();
}

/** Mismo cálculo que el del servidor: dígito verificador de la CLABE. */
function clabeOk(txt){
  const d = String(txt || '').replace(/\D/g, '');
  if(d.length !== 18) return false;
  const pesos = [3, 7, 1];
  let suma = 0;
  for(let i = 0; i < 17; i++) suma += (Number(d[i]) * pesos[i % 3]) % 10;
  return ((10 - (suma % 10)) % 10) === Number(d[17]);
}

function guardarCobro(){
  return conBoton('bGuardarCobro', 'Guardando…', async () => {
    const r = await sb.rpc('ref_guardar_cobro', {
      p_titular:  $('cTitular').value,
      p_banco:    $('cBanco').value,
      p_clabe:    $('cClabe').value,
      p_whatsapp: $('cWhats').value
    });
    if(r.error) return toast(errLegible(r.error), true);
    if(!r.data || !r.data.ok) return toast((r.data && r.data.mensaje) || 'No se pudo guardar.', true);
    vibra([15, 60, 15]);
    toast(r.data.mensaje);
    S.editandoCobro = false;
    await cargarCobro();
    irA('inicio');
  });
}

function reclamar(seccion, idBoton){
  return conBoton(idBoton, 'Enviando…', async () => {
    const r = await sb.rpc('ref_reclamar', { p_seccion: seccion });
    if(r.error) return toast(errLegible(r.error), true);
    if(r.data && r.data.falta_cobro){
      toast('Primero pon tus datos para el depósito', true,
            'Sin CLABE no tenemos a dónde mandarte el dinero');
      return irA('cobro');
    }
    if(!r.data || !r.data.ok) return toast((r.data && r.data.mensaje) || 'No se pudo reclamar.', true);
    vibra([15, 60, 15]);
    toast(r.data.mensaje);
    await refrescar();
  });
}

async function cerrarSesion(){
  try{ if(S.canal){ await sb.removeChannel(S.canal); S.canal = null; } }catch(e){}
  S.vivo = false;
  await sb.auth.signOut().catch(() => {});
  S.promotor = null; S.bonos = null; S.comisiones = null; S.inactivos = null;
  S.modo = 'login'; S.pw = '';
  irA('acceso');
}
