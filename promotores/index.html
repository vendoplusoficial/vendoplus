<html lang="es">
<head>

<style>
/* =====================================================================
   PORTAL DE PROMOTORES · VENDOPLUS
   Misma identidad que la app: verde de marca, tarjetas limpias, bordes
   suaves, letra fuerte. Los colores y medidas se copiaron tal cual del
   index.html de VendoPlus para que se sienta la misma casa.
   ===================================================================== */
:root{
  --brand:#25D366;  --brand-2:#1DAF5A;  --brand-soft:#E5FAEC;  --brand-ink:#0E7A3D;
  --brand-deep:#0E7A3D; --brand-deeper:#0A5A2D; --brand-deepest:#063D1F;
  --teal:#128C7E; --teal-soft:#DDF3EF; --teal-ink:#0B6B61;

  --bg:#F3F4FA; --surface:#FFFFFF; --surface-alt:#EEF0F7;
  --ink:#16213E; --ink-soft:#8A93AC; --ink-faint:#C9CEDD;
  --border:#E4E7F1;

  --accent:#FFD666; --accent-strong:#F5BF3C; --accent-soft:#FFF0C2;
  --accent-2:#E1594C; --danger-bg:#FBEAE8;
  --success:#33A873; --success-bg:#E7F7EF;

  --radius-card:18px; --radius-btn:13px; --radius-chip:999px;
  --shadow-card:0 1px 2px rgba(22,33,62,.04), 0 6px 18px rgba(22,33,62,.05);
  --shadow-pop:0 10px 26px rgba(22,33,62,.14);
  --sans:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono:'SFMono-Regular', ui-monospace, 'Courier New', Courier, monospace;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--sans); background:var(--bg); color:var(--ink);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{ font-family:inherit; cursor:pointer; }
a{ color:var(--brand-ink); }

.wrap{ max-width:560px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; }

/* ---------- Encabezado ---------- */
.top{
  display:flex; align-items:center; gap:12px;
  padding:calc(env(safe-area-inset-top) + 16px) 18px 14px;
  background:var(--surface); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:20;
}
.top h1{ font-size:17px; font-weight:800; margin:0; flex:1; letter-spacing:-.2px; }
.top .marca{ display:flex; align-items:center; gap:9px; flex:1; min-width:0; }
.logo{
  width:30px; height:30px; border-radius:9px; flex:none;
  background:linear-gradient(145deg, var(--brand), var(--brand-2));
  display:grid; place-items:center; color:#fff;
}
.logo svg{ width:17px; height:17px; }
.icon-btn{
  width:38px; height:38px; border-radius:11px; border:none; flex:none;
  background:var(--surface-alt); color:var(--ink-soft); display:grid; place-items:center;
}
.icon-btn:active{ transform:scale(.94); }
.icon-btn svg{ width:19px; height:19px; }
.back{ background:var(--surface-alt); color:var(--ink); }

/* ---------- Cuerpo ---------- */
.body{ flex:1; padding:18px 16px calc(env(safe-area-inset-bottom) + 90px); }
.vista{ animation:entra .26s cubic-bezier(.22,.9,.3,1); }
@keyframes entra{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }

/* ---------- Tarjetas ---------- */
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-card); box-shadow:var(--shadow-card);
  padding:18px; margin-bottom:14px;
}
.card.tap{ width:100%; text-align:left; display:block; border-color:var(--border); }
.card.tap:active{ transform:scale(.99); background:#FCFDFF; }
.card-top{ display:flex; align-items:center; gap:11px; margin-bottom:13px; }
.card-ico{
  width:34px; height:34px; border-radius:10px; flex:none; display:grid; place-items:center;
  background:var(--brand-soft); color:var(--brand-ink);
}
.card-ico.teal{ background:var(--teal-soft); color:var(--teal-ink); }
.card-ico.amar{ background:var(--accent-soft); color:#8A6440; }
.card-ico svg{ width:18px; height:18px; }
.card-title{ font-size:14.5px; font-weight:800; margin:0; letter-spacing:-.1px; }
.card-note{ font-size:13px; font-weight:500; color:var(--ink-soft); margin:0; line-height:1.55; }
.chev{ margin-left:auto; color:var(--ink-faint); display:grid; place-items:center; }
.chev svg{ width:18px; height:18px; }

/* ---------- Enlace de invitación ---------- */
.enlace-caja{
  display:flex; align-items:center; gap:10px;
  background:var(--surface-alt); border:1px dashed var(--ink-faint);
  border-radius:12px; padding:12px 13px; margin-bottom:11px;
}
.enlace-txt{
  flex:1; min-width:0; font-family:var(--mono); font-size:12.5px; font-weight:700;
  color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.btn-copiar{
  flex:none; border:none; border-radius:10px; padding:9px 12px;
  background:var(--ink); color:#fff; font-size:12.5px; font-weight:800;
  display:inline-flex; align-items:center; gap:6px;
}
.btn-copiar svg{ width:14px; height:14px; }
.btn-copiar.ok{ background:var(--success); }

/* ---------- Cartera ---------- */
.saldo{ display:flex; align-items:baseline; gap:7px; margin:2px 0 4px; }
.saldo-num{ font-size:38px; font-weight:800; letter-spacing:-1.4px; line-height:1; }
.saldo-mon{ font-size:14px; font-weight:800; color:var(--ink-soft); }
.saldo-et{ font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:0 0 2px; }

/* ---------- Desglose ---------- */
.fila{
  display:flex; align-items:center; gap:12px;
  padding:14px 0; border-bottom:1px solid var(--border);
}
.fila:last-child{ border-bottom:none; }
.fila-txt{ flex:1; min-width:0; }
.fila-t{ font-size:14px; font-weight:700; margin:0; }
.fila-s{ font-size:12.5px; font-weight:500; color:var(--ink-soft); margin:2px 0 0; line-height:1.5; }
.fila-n{ font-size:15.5px; font-weight:800; flex:none; white-space:nowrap; }
.fila-n.verde{ color:var(--brand-ink); }
.fila-n.gris{ color:var(--ink-soft); }
.fila-n.roja{ color:var(--accent-2); }

/* ---------- Etiquetas de estado ---------- */
.tag{
  display:inline-flex; align-items:center; gap:5px;
  font-size:11px; font-weight:800; padding:4px 9px; border-radius:var(--radius-chip);
  background:var(--surface-alt); color:var(--ink-soft); white-space:nowrap;
}
.tag.disp{ background:var(--success-bg); color:var(--brand-ink); }
.tag.gen{ background:var(--accent-soft); color:#8A6440; }
.tag.proc{ background:var(--teal-soft); color:var(--teal-ink); }
.tag.canc{ background:var(--danger-bg); color:var(--accent-2); }

/* ---------- Barra de progreso ---------- */
.barra{ height:7px; border-radius:99px; background:var(--surface-alt); overflow:hidden; margin-top:9px; }
.barra i{ display:block; height:100%; border-radius:99px; background:linear-gradient(90deg, var(--brand), var(--brand-2)); }

/* ---------- Botones ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border:none; border-radius:var(--radius-btn);
  padding:14px 18px; font-size:15px; font-weight:700;
  background:var(--surface-alt); color:var(--ink);
}
.btn svg{ width:17px; height:17px; }
.btn.dark{ background:var(--ink); color:#fff; }
.btn.primary{ background:var(--brand); color:#fff; }
.btn.ghost{ background:var(--surface); border:1.6px solid var(--border); color:var(--ink); }
.btn.block{ width:100%; }
.btn.xl{ padding:17px 20px; font-size:16.5px; border-radius:16px; }
.btn:disabled{ opacity:.5; }
.btn:not(:disabled):active{ transform:scale(.985); }
.btn.bloq{ background:var(--surface-alt); color:var(--ink-faint); }

/* ---------- Formularios ---------- */
.field{ margin-bottom:16px; text-align:left; }
.field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:7px; }
.entrada{
  width:100%; border:1.6px solid var(--border); border-radius:14px;
  padding:15px 16px; font-size:16px; font-weight:700;
  color:var(--ink); background:var(--surface); font-family:inherit;
}
.entrada:focus{ outline:none; border-color:var(--brand); }
.pw-caja{ position:relative; }
.pw-ojo{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  width:40px; height:40px; border:none; background:none; color:var(--ink-soft);
  display:grid; place-items:center; border-radius:10px;
}
.pw-ojo svg{ width:19px; height:19px; }

.otp-row{ display:flex; gap:9px; justify-content:space-between; margin:6px 0 18px; }
.otp-cell{
  flex:1; min-width:0; aspect-ratio:1 / 1.18;
  border:1.8px solid var(--border); border-radius:15px;
  background:var(--surface-alt); font-family:inherit;
  font-size:24px; font-weight:800; text-align:center; color:var(--ink);
  padding:0; -moz-appearance:textfield;
}
.otp-cell::-webkit-outer-spin-button, .otp-cell::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.otp-cell:focus{ border-color:var(--brand); background:var(--surface); outline:none; }
.otp-cell.filled{ background:var(--surface); border-color:var(--ink-faint); }
.otp-row.error .otp-cell{ border-color:var(--accent-2); animation:shake .32s ease; }
@keyframes shake{ 10%,90%{transform:translateX(-2px)} 30%,70%{transform:translateX(3px)} 50%{transform:translateX(-3px)} }
.otp-help{ font-size:13.5px; font-weight:600; color:var(--ink-soft); text-align:center; margin:0; }
.otp-help button{ border:none; background:none; color:var(--brand-ink); font-weight:800; text-decoration:underline; padding:0; font-size:13.5px; }
.otp-help button:disabled{ color:var(--ink-faint); text-decoration:none; }

/* ---------- Pantallas de acceso ---------- */
.acceso{ background:var(--surface); min-height:100dvh; display:flex; flex-direction:column; }
.acceso-in{ padding:calc(env(safe-area-inset-top) + 22px) 22px 32px; max-width:460px; margin:0 auto; width:100%; }
.acceso-ilu{ display:grid; place-items:center; margin:10px 0 20px; }
.acceso-ilu svg{ width:118px; height:118px; }
.tit{ font-size:25px; font-weight:800; letter-spacing:-.7px; margin:4px 0 8px; text-align:center; }
.sub{ font-size:14px; font-weight:500; color:var(--ink-soft); line-height:1.6; margin:0 0 20px; text-align:center; }
.cambia{ text-align:center; font-size:13.5px; font-weight:600; color:var(--ink-soft); margin:16px 0 0; }
.cambia button{ border:none; background:none; color:var(--brand-ink); font-weight:800; font-size:13.5px; padding:0; text-decoration:underline; }
.aviso-correo{ font-size:12.5px; font-weight:600; color:var(--ink-soft); text-align:center; margin:-6px 0 14px; }

/* ---------- Ayuda ---------- */
.fab{
  position:fixed; right:max(16px, calc(50% - 280px + 16px));
  bottom:calc(env(safe-area-inset-bottom) + 20px);
  width:52px; height:52px; border-radius:50%; border:none; z-index:30;
  background:var(--surface); color:var(--brand-ink);
  box-shadow:var(--shadow-pop); display:grid; place-items:center;
  border:1px solid var(--border);
}
.fab:active{ transform:scale(.93); }
.fab svg{ width:24px; height:24px; }

.ay-h{ font-size:15px; font-weight:800; margin:22px 0 7px; letter-spacing:-.1px; }
.ay-h:first-child{ margin-top:0; }
.ay-p{ font-size:14px; font-weight:500; color:#4A5370; line-height:1.65; margin:0 0 9px; }
.ay-p b{ color:var(--ink); font-weight:800; }
.ay-ej{
  background:var(--surface-alt); border-radius:12px; padding:13px 14px; margin:10px 0 4px;
  font-size:13.5px; font-weight:600; color:#4A5370; line-height:1.7;
}
.ay-ej b{ color:var(--ink); }

/* ---------- Avisos ---------- */
.vacio{ text-align:center; padding:34px 18px; }
.vacio svg{ width:78px; height:78px; margin-bottom:12px; }
.vacio p{ font-size:14px; font-weight:600; color:var(--ink-soft); margin:0; line-height:1.6; }

.aviso{
  display:flex; gap:11px; align-items:flex-start;
  background:var(--accent-soft); border-radius:12px; padding:13px 14px; margin-bottom:14px;
}
.aviso svg{ width:18px; height:18px; flex:none; color:#8A6440; margin-top:1px; }
.aviso p{ margin:0; font-size:13px; font-weight:600; color:#6B4E2E; line-height:1.55; }

.toast{
  position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 86px);
  transform:translateX(-50%) translateY(14px); z-index:60;
  background:var(--ink); color:#fff; border-radius:13px;
  padding:13px 17px; font-size:13.5px; font-weight:700;
  box-shadow:var(--shadow-pop); max-width:calc(100% - 32px);
  opacity:0; pointer-events:none; transition:opacity .22s ease, transform .22s ease;
  display:flex; align-items:center; gap:9px;
}
.toast.ver{ opacity:1; transform:translateX(-50%) translateY(0); }
.toast svg{ width:17px; height:17px; flex:none; }
.toast.mal{ background:var(--accent-2); }

.cargando{ display:grid; place-items:center; min-height:100dvh; }
.spin{
  width:30px; height:30px; border-radius:50%;
  border:3px solid var(--surface-alt); border-top-color:var(--brand);
  animation:gira .8s linear infinite;
}
@keyframes gira{ to{ transform:rotate(360deg); } }

.vivo{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11px; font-weight:800; color:var(--ink-soft);
}
.vivo i{ width:7px; height:7px; border-radius:50%; background:var(--ink-faint); }
.vivo.on i{ background:var(--brand); animation:late 2s ease-in-out infinite; }
@keyframes late{ 50%{ opacity:.35; } }

@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
}
</style>
</head>

/** Traduce los errores de Supabase a algo que cualquiera entienda. */
function errLegible(e){
  const m = String(e?.message ?? e ?? '');
  const code = e?.code ?? '';
  const status = e?.status ?? 0;
  if(/invalid login credentials/i.test(m))        return 'Correo o contraseña incorrectos';
  if(/token has expired|expired/i.test(m))        return 'Ese código ya venció: pide otro';
  if(/invalid.*(otp|token)|otp.*invalid/i.test(m))return 'Ese código no es correcto';
  if(code === 'same_password' || /should be different/i.test(m)) return 'La contraseña nueva debe ser distinta a la anterior';
  if(code === 'weak_password' || /password should|weak password/i.test(m)) return 'Esa contraseña es muy débil: usa al menos 8 caracteres';
  if(code === 'over_email_send_rate_limit' || /rate limit/i.test(m) || status === 429) return 'Se mandaron muchos correos seguidos. Espera unos minutos';
  if(/error sending|smtp|sending .*email/i.test(m)) return 'No se pudo mandar el correo. Inténtalo en un momento';
  if(/failed to fetch|networkerror|network|load failed/i.test(m)) return 'Sin conexión: revisa tu internet';
  if(status >= 500) return 'El servidor no contestó. Inténtalo otra vez';
  return m || 'Algo salió mal, inténtalo otra vez';
}

let ocupado = false;
async function conBoton(id, etiqueta, fn){
  if(ocupado) return;
  ocupado = true;
  const b = id ? $(id) : null;
  const antes = b ? b.innerHTML : '';
  if(b){ b.disabled = true; b.textContent = etiqueta; }
  try{ return await fn(); }
  catch(e){ console.error(e); toast(errLegible(e), true); }
  finally{
    ocupado = false;
    if(b && b.isConnected){ b.disabled = false; b.innerHTML = antes; }
  }
}

/* =====================================================================
   RUTA: ¿portal del promotor o página de invitación?
   El enlace de un promotor es  .../?c=CODIGO
   ===================================================================== */
/* Nombres de carpeta que NUNCA son un código de promotor. */
const CARPETAS = ['promotores', 'promotor'];

function codigoLimpio(s){
  const c = String(s || '').trim().toUpperCase().replace(/^\/+|\/+$/g, '');
  if(!/^[A-Z0-9]{4,16}$/.test(c)) return null;
  if(CARPETAS.includes(c.toLowerCase())) return null;
  return c;
}

/**
 * Saca el código del promotor de la dirección. Se aceptan tres formas,
 * para que el enlace funcione se abra como se abra:
 *   1. /promotores/ABNER001       ← la buena, la que se comparte
 *   2. /promotores/?c=ABNER001    ← la que usa el rebote del 404
 *   3. /promotores/#ABNER001      ← respaldo, igual que el menú digital
 */
function codigoDeLaUrl(){
  const q = new URLSearchParams(location.search);
  const porQuery = codigoLimpio(q.get('c') || q.get('ref'));
  if(porQuery) return porQuery;

  const porHash = codigoLimpio((location.hash || '').replace(/^#\/?/, ''));
  if(porHash) return porHash;

  const partes = location.pathname.split('/').filter(Boolean);
  const ultima = partes[partes.length - 1] || '';
  if(/\.html?$/i.test(ultima)) return null;      // .../promotores/index.html
  if(partes.length < 2) return null;             // .../promotores  → el portal
  return codigoLimpio(ultima);
}

/** Base del portal, sin el código ni el archivo: p. ej. /promotores */
function basePortal(){
  let p = location.pathname.replace(/\/[^\/]*\.html?$/i, '/');
  const partes = p.split('/').filter(Boolean);
  const ultima = partes[partes.length - 1] || '';
  if(codigoLimpio(ultima)) partes.pop();         // quitar el código si viene en la ruta
  return '/' + partes.join('/');
}

/**
 * Deja la dirección bonita en la barra. Si el negocio llegó por el rebote
 * (/promotores/?c=ABNER001), se reescribe a /promotores/ABNER001 sin
 * recargar nada. Es solo cosmético: la atribución ya se decide en el servidor.
 */
function enderezarUrl(codigo){
  try{
    const limpia = (basePortal().replace(/\/+$/, '') || '') + '/' + codigo;
    if(location.pathname + location.search !== limpia){
      history.replaceState(null, '', limpia);
    }
  }catch(e){ /* si el navegador no deja, no pasa nada */ }
}

/* =====================================================================
   ===================  LADO DEL NEGOCIO (INVITACIÓN)  =================
   El negocio deja su correo aquí. A partir de ese momento la atribución
   vive en el servidor, atada al correo: aguanta que cambie de celular,
   que cierre el navegador o que termine su registro días después.
   ===================================================================== */
async function apiAtribuir(cuerpo){
  const r = await fetch(CONFIG.SUPABASE_URL + '/functions/v1/ref-atribuir', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', apikey:CONFIG.SUPABASE_ANON_KEY },
    body: JSON.stringify(cuerpo)
  });
  return await r.json().catch(() => ({ ok:false, mensaje:'No se pudo conectar.' }));
}

/* =====================================================================
   PINTAR
   ===================================================================== */
function pintar(){
  const app = $('app');
  const p = S.pantalla;

  if(p === 'cargando'){
    app.className = 'cargando';
    app.innerHTML = '<div class="spin"></div>';
    return;
  }

  if(['acceso','codigo','clave','olvide','nombre'].includes(p)){
    app.className = 'acceso';
    app.innerHTML = p === 'acceso' ? pantallaAcceso()
                  : p === 'codigo' ? pantallaCodigo()
                  : p === 'clave'  ? pantallaClave()
                  : p === 'olvide' ? pantallaOlvide()
                  : pantallaNombre();
    document.querySelector('meta[name=theme-color]').content = '#FFFFFF';
    cablearAcceso();
    return;
  }

  app.className = 'wrap';
  app.innerHTML = p === 'inicio' ? pantallaInicio()
                : p === 'saldo'  ? pantallaSaldo()
                : p === 'trans'  ? pantallaTransacciones()
                : pantallaAyuda();
  document.querySelector('meta[name=theme-color]').content = p === 'inicio' ? '#FFFFFF' : '#FFFFFF';
  cablearPortal();
}

/* ---------- Eventos de las pantallas de acceso ---------- */
function cablearAcceso(){
  const p = S.pantalla;

  if(p === 'acceso'){
    const cor = $('aCorreo');
    cor.oninput = () => { S.correo = cor.value.trim(); };
    cor.onkeydown = ev => { if(ev.key === 'Enter'){ ev.preventDefault(); accionAcceso(); } };
    $('aBtn').onclick = accionAcceso;
    $('bCambia').onclick = () => { S.modo = S.modo === 'login' ? 'signup' : 'login'; S.pw = ''; pintar(); };
    if($('bOlvide')) $('bOlvide').onclick = () => { S.fpaso = 1; S.fverificado = false; irA('olvide'); };
    if($('aPw')){
      $('aPw').oninput = e => { S.pw = e.target.value; };
      $('aPw').onkeydown = ev => { if(ev.key === 'Enter'){ ev.preventDefault(); accionAcceso(); } };
      ojo('aOjo', 'aPw');
    }
    setTimeout(() => cor.focus(), 160);
  }

  if(p === 'codigo'){
    $('bAtras').onclick = async () => { await sb.auth.signOut().catch(() => {}); clearInterval(S.timer); irA('acceso'); };
    cablearOtp();
    $('oBtn').onclick = verificarCodigo;
    cablearReenvio();
  }

  if(p === 'clave'){
    const pw = $('pPw');
    pw.oninput = () => { S.pw = pw.value; $('pBtn').disabled = pw.value.length < 8; };
    pw.onkeydown = ev => { if(ev.key === 'Enter' && pw.value.length >= 8){ ev.preventDefault(); guardarClave(); } };
    ojo('pOjo', 'pPw');
    $('pBtn').onclick = guardarClave;
    setTimeout(() => pw.focus(), 160);
  }

  if(p === 'olvide'){
    $('bAtras').onclick = () => {
      clearInterval(S.timer);
      if(S.fpaso === 2){ S.fpaso = 1; pintar(); } else { S.modo = 'login'; irA('acceso'); }
    };
    if(S.fpaso === 2){
      ojo('fOjo', 'fPw');
      $('fBtn').onclick = confirmarOlvide;
      $('fPw').onkeydown = ev => { if(ev.key === 'Enter'){ ev.preventDefault(); confirmarOlvide(); } };
      cablearReenvio();
      setTimeout(() => $('fCod').focus(), 160);
    }else{
      const c = $('fCorreo');
      c.oninput = () => { S.correo = c.value.trim(); };
      c.onkeydown = ev => { if(ev.key === 'Enter'){ ev.preventDefault(); enviarOlvide(); } };
      $('fBtn').onclick = enviarOlvide;
      setTimeout(() => c.focus(), 160);
    }
  }

  if(p === 'nombre'){
    const n = $('nNom');
    n.onkeydown = ev => { if(ev.key === 'Enter'){ ev.preventDefault(); crearPromotor(); } };
    $('nBtn').onclick = crearPromotor;
    setTimeout(() => n.focus(), 160);
  }
}

function ojo(idBtn, idPw){
  const b = $(idBtn); if(!b) return;
  b.onclick = () => {
    const i = $(idPw);
    const ver = i.type === 'password';
    i.type = ver ? 'text' : 'password';
    b.innerHTML = ver ? ic('ojoNo') : ic('ojo');
    i.focus();
  };
}

function cablearReenvio(){
  const area = $('reenvio'); if(!area) return;
  const b = $('bReenviar');
  if(b) b.onclick = () => { if(S.pantalla === 'olvide') enviarOlvide(); else accionAcceso(); };
}

/* ---------- Celdas del código ---------- */
function cablearOtp(){
  const n = CONFIG.CODIGO_DIGITOS;
  const celdas = [];
  for(let i = 0; i < n; i++) celdas.push($('c' + i));

  const revisar = () => {
    const v = celdas.map(c => c.value).join('');
    $('oBtn').disabled = v.length !== n;
    celdas.forEach(c => c.classList.toggle('filled', !!c.value));
    if(v.length === n) verificarCodigo();
  };

  celdas.forEach((c, i) => {
    c.oninput = () => {
      c.value = c.value.replace(/\D/g, '').slice(0, 1);
      if(c.value && i < n - 1) celdas[i + 1].focus();
      revisar();
    };
    c.onkeydown = ev => {
      if(ev.key === 'Backspace' && !c.value && i > 0){ celdas[i - 1].focus(); celdas[i - 1].value = ''; revisar(); }
    };
    c.onpaste = ev => {
      ev.preventDefault();
      const t = (ev.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, n);
      for(let k = 0; k < n; k++) celdas[k].value = t[k] || '';
      celdas[Math.min(t.length, n - 1)].focus();
      revisar();
    };
  });
  setTimeout(() => celdas[0].focus(), 180);
}
const valorOtp = () => {
  let v = '';
  for(let i = 0; i < CONFIG.CODIGO_DIGITOS; i++) v += ($('c' + i) || {}).value || '';
  return v;
};
function fallaOtp(msg){
  const r = $('otpRow');
  if(r){ r.classList.add('error'); setTimeout(() => r.classList.remove('error'), 400); }
  for(let i = 0; i < CONFIG.CODIGO_DIGITOS; i++){ const c = $('c' + i); if(c){ c.value = ''; c.classList.remove('filled'); } }
  const p = $('c0'); if(p) p.focus();
  $('oBtn').disabled = true;
  vibra([18, 60, 18]);
  toast(msg, true);
}

/* ---------- Acciones de acceso ---------- */
function accionAcceso(){
  const correo = normCorreo(S.correo);
  if(!esCorreo(correo)) return toast('Revisa tu correo: debe verse así nombre@gmail.com', true);

  const login = S.modo === 'login';
  const reenvio = S.pantalla === 'codigo';
  if(reenvio && S.reenvio > 0) return;
  vibra(12);

  return conBoton(reenvio ? null : 'aBtn', login ? 'Entrando…' : 'Enviando…', async () => {
    if(login){
      if((S.pw || '').length < 1) return toast('Escribe tu contraseña', true);
      const { error } = await sb.auth.signInWithPassword({ email:correo, password:S.pw });
      if(error) return toast(errLegible(error), true);
      S.pw = '';
      return await despuesDeEntrar();
    }
    const { error } = await mandarCodigo(correo, true);
    if(error) return toast(errLegible(error), true);
    S.reenvio = 60;
    if(reenvio){
      const el = $('reenvio'); if(el){ el.innerHTML = htmlReenvio(); cablearReenvio(); }
      toast('Te mandamos otro código');
    }else irA('codigo');
    tiempoReenvio();
  });
}

function verificarCodigo(){
  const token = valorOtp();
  if(token.length !== CONFIG.CODIGO_DIGITOS) return;
  const correo = normCorreo(S.correo);

  return conBoton('oBtn', 'Verificando…', async () => {
    const { error } = await revisarCodigo(correo, token);
    if(error) return fallaOtp(errLegible(error));
    clearInterval(S.timer);
    vibra(20);

    // ¿Ya era promotor? Entonces entra directo.
    const t = await sb.rpc('ref_mi_tablero');
    if(t.data && t.data.ok){
      S.promotor = t.data;
      return await abrirPortal();
    }
    S.pw = '';
    irA('clave');
  });
}

function guardarClave(){
  const pw = S.pw || '';
  if(pw.length < 8) return toast('La contraseña debe tener mínimo 8 caracteres', true);

  return conBoton('pBtn', 'Guardando…', async () => {
    const { error } = await sb.auth.updateUser({ password:pw, data:{ vp_promotor:true } });
    if(error) return toast(errLegible(error), true);
    S.pw = '';
    irA('nombre');
  });
}

function crearPromotor(){
  const nombre = ($('nNom').value || '').trim();
  if(nombre.length < 2) return toast('Escribe tu nombre', true);

  return conBoton('nBtn', 'Creando…', async () => {
    const r = await sb.rpc('ref_alta_promotor', { p_nombre: nombre });
    if(r.error) return toast(errLegible(r.error), true);
    if(!r.data || !r.data.ok) return toast(r.data?.mensaje || 'No se pudo crear tu cuenta de promotor.', true);
    vibra([15, 60, 15]);
    await abrirPortal();
    toast('Listo, tu enlace ya está activo');
  });
}

function enviarOlvide(){
  const correo = normCorreo(S.correo);
  if(!esCorreo(correo)) return toast('Revisa tu correo: debe verse así nombre@gmail.com', true);
  const reenvio = S.fpaso === 2;
  if(reenvio && S.reenvio > 0) return;

  return conBoton(reenvio ? null : 'fBtn', 'Enviando…', async () => {
    const { error } = await mandarCodigo(correo, false);
    if(error) return toast(errLegible(error), true);
    S.reenvio = 60; S.fverificado = false;
    if(reenvio){ const el = $('reenvio'); if(el){ el.innerHTML = htmlReenvio(); cablearReenvio(); } }
    else{ S.fpaso = 2; pintar(); }
    tiempoReenvio();
    toast('Te mandamos un código a tu correo');
  });
}

function confirmarOlvide(){
  const correo = normCorreo(S.correo);
  const token = (($('fCod') || {}).value || '').replace(/\D/g, '');
  const pw = ($('fPw') || {}).value || '';
  if(!S.fverificado && token.length !== CONFIG.CODIGO_DIGITOS)
    return toast('Escribe el código de ' + CONFIG.CODIGO_DIGITOS + ' dígitos', true);
  if(pw.length < 8) return toast('La contraseña debe tener mínimo 8 caracteres', true);

  return conBoton('fBtn', 'Cambiando…', async () => {
    if(!S.fverificado){
      const v = await revisarCodigo(correo, token);
      if(v.error) return toast(errLegible(v.error), true);
      S.fverificado = true;   // el código ya se usó: si falla la contraseña no se pide otra vez
    }
    const u = await sb.auth.updateUser({ password:pw });
    if(u.error) return toast(errLegible(u.error), true);
    clearInterval(S.timer);
    S.fverificado = false; S.fpaso = 1;
    await despuesDeEntrar();
    toast('Contraseña actualizada');
  });
}

/* ---------- Después de entrar ---------- */
async function despuesDeEntrar(){
  const t = await sb.rpc('ref_mi_tablero');
  if(t.error){ toast(errLegible(t.error), true); return irA('acceso'); }
  if(t.data && t.data.ok){
    S.promotor = t.data;
    return await abrirPortal();
  }
  // Tiene sesión pero todavía no es promotor: le pedimos su nombre.
  irA('nombre');
}

async function abrirPortal(){
  irA('inicio');
  escuchar();
  refrescar();
}

/* ---------- Eventos del portal ---------- */
function cablearPortal(){
  const p = S.pantalla;

  if(p === 'inicio'){
    $('bCopiar').onclick = copiarEnlace;
    $('bCartera').onclick = async () => { irA('saldo'); await cargarCartera(); };
    $('bTrans').onclick   = async () => { irA('trans'); await cargarTransacciones(); };
    $('bAyuda').onclick   = () => irA('ayuda');
    $('bSalir').onclick   = cerrarSesion;
  }
  if(['saldo','trans','ayuda'].includes(p)){
    $('bAtras').onclick = () => irA('inicio');
  }
  if(p === 'saldo' && $('bReclamar')){
    // Botón solo visual: no hace nada, no mueve el saldo.
    $('bReclamar').onclick = ev => { ev.preventDefault(); };
  }
}

async function copiarEnlace(){
  const enlace = (S.promotor || {}).enlace || '';
  if(!enlace) return;
  const b = $('bCopiar');
  try{
    await navigator.clipboard.writeText(enlace);
  }catch(e){
    const t = document.createElement('textarea');
    t.value = enlace; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    try{ document.execCommand('copy'); }catch(e2){}
    document.body.removeChild(t);
  }
  vibra(15);
  b.classList.add('ok');
  b.innerHTML = ic('check') + ' Copiado';
  setTimeout(() => { if(b.isConnected){ b.classList.remove('ok'); b.innerHTML = ic('copiar') + ' Copiar'; } }, 1800);
}

async function cerrarSesion(){
  try{ if(S.canal){ await sb.removeChannel(S.canal); S.canal = null; } }catch(e){}
  S.vivo = false;
  await sb.auth.signOut().catch(() => {});
  S.promotor = null; S.cartera = null; S.transacciones = null;
  S.modo = 'login'; S.pw = '';
  irA('acceso');
}

/* =====================================================================
   DATOS
   ===================================================================== */
async function cargarTablero(){
  const r = await sb.rpc('ref_mi_tablero');
  if(r.data && r.data.ok){ S.promotor = r.data; if(S.pantalla === 'inicio') pintar(); }
}
async function cargarCartera(){
  const r = await sb.rpc('ref_mi_cartera');
  if(r.data && r.data.ok){ S.cartera = r.data; if(['saldo','ayuda'].includes(S.pantalla)) pintar(); }
}
async function cargarTransacciones(){
  const r = await sb.rpc('ref_mis_transacciones', { p_limite: 300 });
  if(r.data && r.data.ok){ S.transacciones = r.data; if(S.pantalla === 'trans') pintar(); }
}

/** Trae lo que haga falta según la pantalla donde esté el promotor. */
let refrescando = false;
async function refrescar(){
  if(refrescando) return;
  refrescando = true;
  try{
    await cargarTablero();
    if(S.pantalla === 'saldo' || S.cartera) await cargarCartera();
    if(S.pantalla === 'trans' || S.transacciones) await cargarTransacciones();
  }catch(e){ console.warn('refrescar', e); }
  finally{ refrescando = false; }
}

/* =====================================================================
   TIEMPO REAL
   Cuando un negocio referido paga, el backend lo procesa y estas tablas
   cambian. El portal se actualiza solo: sin recargar, sin volver a entrar.
   Las políticas RLS se aplican también aquí, así que cada promotor recibe
   únicamente sus propios cambios.
   ===================================================================== */
let reintento = null;
async function escuchar(){
  if(S.canal) return;
  const id = (S.promotor || {}).codigo || 'x';

  /* Realtime tiene que ir firmado con la sesión del promotor: así el
     servidor aplica RLS y solo manda los cambios que le tocan a él. */
  try{
    const { data } = await sb.auth.getSession();
    if(data && data.session) sb.realtime.setAuth(data.session.access_token);
  }catch(e){ console.warn('realtime auth', e); }

  S.canal = sb.channel('promotor:' + id)
    .on('postgres_changes', { event:'*', schema:'public', table:'referral_wallet' },    alCambiar)
    .on('postgres_changes', { event:'*', schema:'public', table:'referral_rewards' },   alCambiar)
    .on('postgres_changes', { event:'*', schema:'public', table:'referral_movements' }, alCambiar)
    .on('postgres_changes', { event:'*', schema:'public', table:'referral_clients' },   alCambiar)
    .on('postgres_changes', { event:'*', schema:'public', table:'referral_periods' },   alCambiar)
    .on('postgres_changes', { event:'*', schema:'public', table:'referral_payments' },  alPago)
    .subscribe(estado => {
      const antes = S.vivo;
      S.vivo = estado === 'SUBSCRIBED';
      if(antes !== S.vivo && S.pantalla === 'inicio') pintar();

      if(['CLOSED','CHANNEL_ERROR','TIMED_OUT'].includes(estado)){
        clearTimeout(reintento);
        reintento = setTimeout(async () => {
          try{ if(S.canal){ await sb.removeChannel(S.canal); S.canal = null; } }catch(e){}
          if(S.promotor) escuchar();
        }, 3000);
      }
    });
}

let pendiente = null;
function alCambiar(){
  // Se junta todo lo que llegue en medio segundo y se refresca una sola vez.
  clearTimeout(pendiente);
  pendiente = setTimeout(refrescar, 500);
}
function alPago(carga){
  // Un pago suelto mueve el avance del negocio, pero NO adelanta recompensas:
  // los $500 y $200 solo se liberan cuando el periodo se cumple de verdad.
  alCambiar();
  const n = carga && carga.new;
  if(n && n.estado === 'pagado' && carga.eventType === 'INSERT'){
    toast('Un negocio tuyo acaba de pagar');
  }
}

/* Al volver a la pestaña, por si se perdió algún aviso mientras no estaba. */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && S.promotor) refrescar();
});

/* =====================================================================
   ARRANQUE
   ===================================================================== */
sb.auth.onAuthStateChange((evento, sesion) => {
  /* Cuando se renueva el token hay que volver a firmar Realtime, o el
     servidor deja de mandar cambios a media sesión. */
  if(evento === 'TOKEN_REFRESHED' && sesion){
    try{ sb.realtime.setAuth(sesion.access_token); }catch(e){}
  }
  if(evento === 'SIGNED_OUT' && S.promotor){
    S.promotor = null; S.cartera = null; S.transacciones = null;
    S.modo = 'login';
    irA('acceso');
  }
});

(async function arrancar(){
  const codigo = codigoDeLaUrl();
  if(codigo) return arrancarInvitacion(codigo);   // llegó un negocio por un enlace

  const { data } = await sb.auth.getSession();
  if(data && data.session){
    const t = await sb.rpc('ref_mi_tablero');
    if(t.data && t.data.ok){
      S.promotor = t.data;
      return abrirPortal();
    }
    // Sesión viva sin perfil de promotor: pedir nombre y crearlo.
    return irA('nombre');
  }
  S.modo = 'signup';
  irA('acceso');
})();
</script>
